<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
@font-face{font-family:P;src:url(fonts/Pretendard-Black.woff2) format("woff2");font-weight:900}
@font-face{font-family:P;src:url(fonts/Pretendard-ExtraBold.woff2) format("woff2");font-weight:800}
@font-face{font-family:P;src:url(fonts/Pretendard-Bold.woff2) format("woff2");font-weight:700}
@font-face{font-family:P;src:url(fonts/Pretendard-Medium.woff2) format("woff2");font-weight:500}
:root{--bg:#f6f4ee;--ink:#111827;--sub:#4b5563;--y:#ffd64f;--r:#e5484d;--line:#e4e0d6;--card:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#888;font-family:P,"Noto Sans CJK KR",sans-serif;color:var(--ink);word-break:keep-all}
.card{width:1080px;height:1350px;position:relative;overflow:hidden;background:var(--bg);margin-bottom:20px}
.top{position:absolute;left:80px;right:80px;top:64px;display:flex;justify-content:space-between;align-items:center;font-size:30px;font-weight:700;color:var(--sub);letter-spacing:.02em}
.top b{color:var(--ink);font-weight:900}
.foot{position:absolute;left:80px;right:80px;bottom:60px;display:flex;justify-content:space-between;align-items:center;font-size:28px;font-weight:700;color:var(--sub)}
.foot .arw{font-size:30px;color:var(--ink);font-weight:900}
.body{position:absolute;left:80px;right:80px;top:170px;bottom:150px;display:flex;flex-direction:column;justify-content:center}
.q{font-size:40px;font-weight:800;color:var(--sub);margin-bottom:18px}
h2{font-size:84px;line-height:1.16;font-weight:900;letter-spacing:-.035em}
mark{background:linear-gradient(transparent 58%,var(--y) 58%,var(--y) 92%,transparent 92%);color:inherit;padding:0 4px}
.red{color:var(--r)}
p.t{font-size:44px;line-height:1.5;font-weight:700;letter-spacing:-.02em;color:#1f2937}
p.s{font-size:34px;line-height:1.5;font-weight:500;color:var(--sub)}
.box{background:var(--card);border:3px solid var(--line);border-radius:28px;padding:40px 44px}
.big{font-size:100px;font-weight:900;letter-spacing:-.04em;line-height:1}
.chip{display:inline-block;background:var(--ink);color:#fff;font-size:30px;font-weight:800;padding:10px 22px;border-radius:999px}
.row{display:flex;gap:28px;align-items:center}
.num{flex:none;width:76px;height:76px;border-radius:50%;background:var(--y);display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900}
.pen{display:flex;flex-direction:column;gap:22px}
.pen .it{background:#fff;border-radius:24px;border:3px solid var(--line);padding:30px 36px}
.pen .k{font-size:38px;font-weight:800;margin-bottom:10px}
.pen .v{font-size:40px;font-weight:900;color:var(--r);letter-spacing:-.02em}
.pen .v small{font-size:32px;color:var(--ink);font-weight:800}
.tl{display:flex;flex-direction:column;gap:0;margin-top:40px}
.tl .st{display:flex;gap:34px;align-items:flex-start}
.tl .dot{flex:none;width:38px;display:flex;flex-direction:column;align-items:center}
.tl .dot i{width:34px;height:34px;border-radius:50%;background:var(--ink);display:block;margin-top:10px}
.tl .dot i.y{background:var(--y);border:6px solid var(--ink)}
.tl .dot u{width:6px;height:120px;background:var(--line);display:block}
.tl .d{font-size:36px;font-weight:900;color:var(--sub)}
.tl .x{font-size:46px;font-weight:900;letter-spacing:-.02em;margin-top:4px}
/* cover */
.cover .ph{position:absolute;inset:0;background-size:cover;background-position:center}
.cover .sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.55) 62%,rgba(0,0,0,.82) 100%)}
.cover .ct{position:absolute;left:80px;right:80px;bottom:120px;color:#fff}
.cover h1{font-size:118px;line-height:1.08;font-weight:900;letter-spacing:-.045em;text-shadow:0 6px 30px rgba(0,0,0,.4)}
.cover h1 em{font-style:normal;color:var(--y)}
.cover .sub{margin-top:30px;font-size:44px;font-weight:800;line-height:1.4}
.cover .tag{display:inline-block;background:var(--y);color:var(--ink);font-size:36px;font-weight:900;padding:10px 24px;border-radius:12px;margin-bottom:30px}
.cover .top{color:#fff}.cover .top b{color:#fff}
/* cover with headline on a bright top area */
.cover.light .sh{background:linear-gradient(180deg,rgba(246,244,238,.92) 0%,rgba(246,244,238,.75) 34%,rgba(246,244,238,0) 52%)}
.cover.light .ct{top:150px;bottom:auto;color:var(--ink)}
.cover.light h1{text-shadow:none}
.cover.light h1 em{color:var(--ink);background:linear-gradient(transparent 60%,var(--y) 60%,var(--y) 94%,transparent 94%)}
.cover.light .sub{color:#1f2937}
.cover.light .top,.cover.light .top b{color:var(--ink)}
</style></head><body>
<div id="root"></div>
<script>
const C=window.CARDS, N=C.cards.length;
const root=document.getElementById('root');
C.cards.forEach((c,i)=>{
  const d=document.createElement('div'); d.className='card '+(c.cls||''); d.id='c'+i;
  const top=`<div class="top"><span><b>ROAD.LOG</b> · ${C.kicker}</span><span>${i+1} / ${N}</span></div>`;
  const foot=`<div class="foot"><span>@${C.handle}</span><span class="arw">${i<N-1?'옆으로 넘기기 →':''}</span></div>`;
  if((c.cls||'').includes('cover')){
    d.innerHTML=`<div class="ph" style="background-image:url('${c.photo}')"></div><div class="sh"></div>${top}
    <div class="ct"><div class="tag">${c.tag}</div><h1>${c.title}</h1><div class="sub">${c.sub}</div></div>`;
  } else {
    d.innerHTML=`${top}<div class="body">${c.html}</div>${foot}`;
  }
  root.appendChild(d);
});
</script></body></html>
