<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
@font-face{font-family:P;src:url(fonts/Pretendard-Black.woff2) format("woff2");font-weight:900}
@font-face{font-family:P;src:url(fonts/Pretendard-ExtraBold.woff2) format("woff2");font-weight:800}
@font-face{font-family:P;src:url(fonts/Pretendard-Bold.woff2) format("woff2");font-weight:700}
@font-face{font-family:P;src:url(fonts/Pretendard-Medium.woff2) format("woff2");font-weight:500}
:root{--bg:#f6f4ee;--ink:#111827;--sub:#4b5563;--y:#ffd64f;--r:#e5484d;--line:#e4e0d6;--blue:#2563eb}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;overflow:hidden;background:var(--bg);font-family:P,"Noto Sans CJK KR",sans-serif;color:var(--ink);word-break:keep-all}
.card{width:1080px;height:1350px;position:relative;overflow:hidden;background:var(--bg)}
.top{position:absolute;left:80px;right:80px;top:60px;display:flex;justify-content:space-between;align-items:center;font-size:30px;font-weight:700;color:var(--sub);letter-spacing:.02em;z-index:5}
.top b{color:var(--ink);font-weight:900}
.foot{position:absolute;left:80px;right:80px;bottom:54px;display:flex;justify-content:space-between;align-items:center;font-size:28px;font-weight:700;color:var(--sub)}
.foot .arw{font-size:30px;color:var(--ink);font-weight:900}
.body{position:absolute;left:80px;right:80px;top:140px;bottom:130px;display:flex;flex-direction:column;justify-content:center}
.img{width:100%;border-radius:32px;overflow:hidden;flex:none;margin-bottom:44px;box-shadow:0 10px 30px rgba(17,24,39,.10)}
.img div{width:100%;height:100%;background-size:cover;background-position:center}
.q{font-size:38px;font-weight:800;color:var(--sub);margin-bottom:14px}
h2{font-size:78px;line-height:1.16;font-weight:900;letter-spacing:-.035em}
mark{background-image:linear-gradient(transparent 58%,var(--y) 58%,var(--y) 92%,transparent 92%);background-repeat:no-repeat;background-size:100% 100%;color:inherit;padding:0 4px}
.red{color:var(--r)}
p.t{font-size:42px;line-height:1.48;font-weight:700;letter-spacing:-.02em;color:#1f2937}
p.s{font-size:32px;line-height:1.5;font-weight:500;color:var(--sub)}
.box{background:#fff;border:3px solid var(--line);border-radius:28px;padding:34px 40px}
.chip{display:inline-block;background:var(--ink);color:#fff;font-size:30px;font-weight:800;padding:10px 22px;border-radius:999px}
.pen{display:flex;flex-direction:column;gap:16px}
.pen .it{background:#fff;border-radius:22px;border:3px solid var(--line);padding:22px 32px}
.pen .k{font-size:34px;font-weight:800;margin-bottom:6px}
.pen .v{font-size:36px;font-weight:900;color:var(--r);letter-spacing:-.02em}
.pen .v small{font-size:30px;color:var(--ink);font-weight:800}
.tl{display:flex;flex-direction:column;margin-top:34px}
.tl .st{display:flex;gap:30px;align-items:flex-start}
.tl .dot{flex:none;width:36px;display:flex;flex-direction:column;align-items:center}
.tl .dot i{width:32px;height:32px;border-radius:50%;background:var(--ink);display:block;margin-top:8px}
.tl .dot i.y{background:var(--y);border:6px solid var(--ink)}
.tl .dot u{width:6px;height:74px;background:var(--line);display:block;transform-origin:top}
.tl .d{font-size:32px;font-weight:900;color:var(--sub)}
.tl .x{font-size:42px;font-weight:900;letter-spacing:-.02em;margin-top:2px}
/* cover */
.cover .ph{position:absolute;inset:0;background-size:cover;background-position:center}
.cover .sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(246,244,238,.92) 0%,rgba(246,244,238,.75) 34%,rgba(246,244,238,0) 52%)}
.cover .ct{position:absolute;left:80px;right:80px;top:150px}
.cover h1{font-size:118px;line-height:1.08;font-weight:900;letter-spacing:-.045em}
.cover .sub{margin-top:30px;font-size:44px;font-weight:800;line-height:1.4;color:#1f2937}
.cover .tag{display:inline-block;background:var(--y);color:var(--ink);font-size:36px;font-weight:900;padding:10px 24px;border-radius:12px;margin-bottom:30px}
/* follow */
.fol{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 90px}
.av{width:230px;height:230px;border-radius:50%;background:var(--ink);display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;box-shadow:0 0 0 10px #fff,0 0 0 16px var(--y)}
.av b{font-size:50px;font-weight:900;letter-spacing:.02em;line-height:1}
.av span{font-size:24px;font-weight:800;color:var(--y);margin-top:8px;letter-spacing:.2em}
.hd{font-size:46px;font-weight:900;margin-top:46px}
.ds{font-size:34px;font-weight:700;color:var(--sub);margin-top:14px;line-height:1.5}
.fbtn{position:relative;margin-top:60px;width:560px;height:118px;border-radius:24px;background:var(--blue);color:#fff;font-size:50px;font-weight:900;display:flex;align-items:center;justify-content:center;overflow:hidden}
.fbtn .on,.fbtn .off{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.fbtn .on{background:#e5e7eb;color:var(--ink)}
.hand{position:absolute;width:96px;height:96px;border-radius:50%;background:rgba(17,24,39,.35);border:6px solid #fff;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.tips{display:flex;gap:18px;margin-top:56px;flex-wrap:wrap;justify-content:center}
.tips span{background:#fff;border:3px solid var(--line);border-radius:999px;font-size:30px;font-weight:800;padding:12px 26px}
.big1{font-size:92px;line-height:1.12;font-weight:900;letter-spacing:-.04em}

/* ---- animations (driven by JS currentTime, all paused) ---- */
.a{animation-fill-mode:both;animation-play-state:paused;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
.up{animation-name:up;animation-duration:.7s}
@keyframes up{from{opacity:0;transform:translateY(46px)}to{opacity:1;transform:none}}
.fade{animation-name:fade;animation-duration:.6s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.pop{animation-name:pop;animation-duration:.6s;animation-timing-function:cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
.left{animation-name:left;animation-duration:.7s}
@keyframes left{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
mark.a{animation-name:mk;animation-duration:.7s;animation-timing-function:ease-out}
@keyframes mk{from{background-size:0% 100%}to{background-size:100% 100%}}
.kb{animation-name:kb;animation-duration:6s;animation-timing-function:linear}
@keyframes kb{from{transform:scale(1.0)}to{transform:scale(1.09)}}
.grow{animation-name:grow;animation-duration:.5s}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.tap{animation-name:tap;animation-duration:1.6s;animation-timing-function:ease-in-out}
@keyframes tap{0%{opacity:0;transform:translate(160px,160px)}35%{opacity:1;transform:translate(0,0)}55%{transform:translate(0,0) scale(.85)}70%{transform:translate(0,0) scale(1)}100%{opacity:1;transform:translate(10px,10px)}}
.press{animation-name:press;animation-duration:.25s}
@keyframes press{0%{transform:scale(1)}50%{transform:scale(.94)}100%{transform:scale(1)}}
.swap{animation-name:swap;animation-duration:.2s}
@keyframes swap{from{opacity:0}to{opacity:1}}
.pulseY{animation-name:pulseY;animation-duration:1.4s;animation-iteration-count:3;animation-timing-function:ease-in-out}
@keyframes pulseY{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.pulse{animation-name:pulse;animation-duration:1.2s;animation-iteration-count:3;animation-timing-function:ease-in-out}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(37,99,235,.45)}50%{box-shadow:0 0 0 22px rgba(37,99,235,0)}}
</style></head><body>
<div class="card" id="card"></div>
<script>
// window.CARD = {type, ...}, window.META={kicker,handle,idx,n}
const C=window.CARD, M=window.META, el=document.getElementById('card');
const topH=`<div class="top"><span><b>ROAD.LOG</b> · ${M.kicker}</span><span>${M.idx} / ${M.n}</span></div>`;
const foot=`<div class="foot"><span>@${M.handle}</span><span class="arw">${M.idx<M.n?'옆으로 넘기기 →':''}</span></div>`;
const img=(src,h)=>`<div class="img" style="height:${h||380}px"><div class="a kb" style="background-image:url('${src}')"></div></div>`;
if(C.type==='cover'){
  el.classList.add('cover');
  el.innerHTML=`<div class="ph a kb" style="background-image:url('${C.photo}');animation-duration:6s"></div><div class="sh"></div>${topH}
  <div class="ct"><div class="tag a pulseY" style="animation-delay:.6s">${C.tag}</div><h1>${C.title}</h1><div class="sub">${C.sub}</div></div>`;
} else if(C.type==='follow'){
  el.innerHTML=`${topH}<div class="fol">
   <div class="av"><b>ROAD<br>LOG</b><span>CAR</span></div>
   <div class="hd">@${M.handle}</div>
   <div class="big1" style="margin-top:40px">${C.title}</div>
   <div class="ds">${C.desc}</div>
   <div class="a pop" style="animation-delay:.25s"><div class="fbtn a pulse" style="animation-delay:.8s"><div class="off">팔로우</div><div class="on a swap" style="animation-delay:2.1s">팔로잉 ✓</div></div></div>
   <div class="tips">${C.tips.map((t,i)=>`<span class="a up" style="animation-delay:${.45+i*.12}s">${t}</span>`).join('')}</div>
  </div><div class="hand a tap" style="left:640px;top:${C.handTop||1000}px;animation-delay:1.2s"></div>`;
} else {
  el.innerHTML=`${topH}<div class="body">${C.img?img(C.img,C.imgH):''}${C.html}</div>${foot}`;
}
// auto-stagger: elements with data-s get delays in order
el.querySelectorAll('.q[data-s]').forEach(e=>{e.removeAttribute('data-s');e.style.animationDelay='';});
let k=0; el.querySelectorAll('[data-s]').forEach(e=>{e.classList.add('a', e.dataset.s||'up'); if(!e.style.animationDelay) e.style.animationDelay=(0.3+0.2*(k++))+'s';});
if(false) el.querySelectorAll('h1,h2').forEach((h,i)=>{ if(!h.classList.contains('a')){h.classList.add('a','up'); h.style.animationDelay=(C.type==='cover'?0.45:0.3)+'s';}});
// highlight wipes after their heading arrives
if(C.type!=='cover') el.querySelectorAll('mark').forEach((m,i)=>{m.classList.add('a'); m.style.animationDelay=(0.25+0.25*i)+'s';});
window.seek=t=>{document.getAnimations().forEach(a=>{a.pause(); a.currentTime=t*1000;});};
</script></body></html>
