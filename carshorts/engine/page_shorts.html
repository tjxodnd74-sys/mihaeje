<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
@font-face{font-family:P;src:url(Pretendard-Black.woff2) format("woff2");font-weight:900}
@font-face{font-family:P;src:url(Pretendard-ExtraBold.woff2) format("woff2");font-weight:800}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000;font-family:P,sans-serif;color:#fff;word-break:keep-all}
/* YouTube-shorts news layout: black page, title top, 4:3 photo middle, plain stroke captions, plain big-number text */
.st{-webkit-text-stroke:14px #000;paint-order:stroke fill}
#title{position:absolute;left:20px;right:20px;top:170px;text-align:center;font-weight:900;line-height:1.15;letter-spacing:-.04em}
#title .l1{font-size:88px}#title .l2{font-size:104px;color:#ffe14a}
#media{position:absolute;left:0;top:500px;width:1080px;height:810px;overflow:hidden;background:#000}
.layer{position:absolute;inset:0;display:none}
.layer img{position:absolute;left:0;top:0;width:1080px;height:810px;object-fit:cover;transform-origin:50% 50%}
#dim{position:absolute;left:0;top:500px;width:1080px;height:810px;background:#000;opacity:0}
#gfx{position:absolute;left:0;top:500px;width:1080px;height:810px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:22px}
#gfx div{font-weight:900;letter-spacing:-.05em;line-height:1.1;white-space:nowrap;paint-order:stroke fill;text-shadow:0 10px 30px rgba(0,0,0,.5);position:relative}
#cap{position:absolute;left:0;right:0;top:1380px;height:120px;display:flex;justify-content:center;align-items:center}
#cap span{display:inline-block;white-space:nowrap;font-size:80px;font-weight:900;letter-spacing:-.04em;line-height:1;transform-origin:50% 60%}
#cap em{font-style:normal;color:#ffe14a}
#src{position:absolute;left:0;right:0;bottom:90px;text-align:center;font-size:26px;font-weight:700;color:rgba(255,255,255,.4)}
</style></head><body>
<div id="title"><div class="l1 st"></div><div class="l2 st"></div></div>
<div id="media"></div><div id="dim"></div><div id="gfx"></div>
<div id="cap"></div><div id="src"></div>
<script>
const S = window.SPEC; const media = document.getElementById('media'), gfx = document.getElementById('gfx'), dim = document.getElementById('dim'), capEl = document.getElementById('cap');
document.querySelector('#title .l1').textContent = S.title[0]; document.querySelector('#title .l2').textContent = S.title[1];
document.getElementById('src').textContent = S.credit || '';
const layers = [];
for (const sh of S.shots) { const d = document.createElement('div'); d.className = 'layer'; const m = document.createElement('img'); m.src = sh.src; if (sh.pos) m.style.objectPosition = sh.pos; d.appendChild(m); media.appendChild(d); layers.push({ d, m }); }
const ease = p => p < 0 ? 0 : p > 1 ? 1 : 1 - Math.pow(1 - p, 3);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const fmt = n => Math.round(n).toLocaleString('ko-KR');
window.seek = async (t) => {
  let i = S.shots.findIndex(s => t >= s.t0 && t < s.t1); if (i < 0) i = t < S.shots[0].t0 ? 0 : S.shots.length - 1;
  const sh = S.shots[i], L = layers[i], u = t - sh.t0, d = sh.t1 - sh.t0;
  layers.forEach((l, k) => l.d.style.display = k === i ? 'block' : 'none');
  L.m.style.transformOrigin = sh.origin || '50% 50%'; L.m.style.transform = `scale(${sh.s0 + (sh.s1 - sh.s0) * clamp(u / d)})`;
  // big-number text: lines appear at their own time; optional strike / count-up
  const g = S.gfx.find(g => t >= g.t0 && t < g.t1);
  if (g) { const v = t - g.t0; dim.style.opacity = 0.5 * ease(v / 0.15);
    gfx.innerHTML = g.lines.filter(l => v >= (l.at || 0)).map(l => { const k = v - (l.at || 0); const pop = 1 + 0.18 * (1 - ease(k / 0.15));
      let txt = l.text; if (l.count) txt = fmt(l.count * ease(k / 0.8)) + l.unit;
      const strike = (l.strikeAt != null && v >= l.strikeAt) ? `<i style="position:absolute;left:-12px;top:48%;height:22px;background:#ff2b2b;border:5px solid #fff;border-radius:12px;width:${clamp((v - l.strikeAt) / 0.2) * 105}%"></i>` : '';
      const col = (l.strikeAt != null && v >= l.strikeAt) ? '#999' : (l.color || '#fff');
      const sk = l.size < 150 ? `-webkit-text-stroke:${Math.round(l.size*0.13)}px #000` : `-webkit-text-stroke:${Math.round(l.size*0.075)}px #fff`;
      return `<div style="font-size:${l.size}px;color:${col};${sk};transform:scale(${pop})">${txt}${strike}</div>`; }).join('');
  } else { dim.style.opacity = 0; gfx.innerHTML = ''; }
  let c = null; for (const k of S.caps) if (t >= k[0] && t < k[1]) c = k;
  if (c) { capEl.innerHTML = '<span class="st">' + c[2].replace(/\|([^|]+)\|/g, '<em>$1</em>') + '</span>'; const sp = capEl.firstChild;
    const w = sp.getBoundingClientRect().width; const fit = Math.min(1, 1020 / Math.max(w, 1)); const pop = 1 + 0.05 * (1 - ease((t - c[0]) / 0.12));
    sp.style.transform = `scale(${fit * pop})`; } else capEl.innerHTML = '';
};
window.ready = async () => { await document.fonts.ready; await Promise.all(layers.map(l => l.m.complete ? 0 : new Promise(r => l.m.onload = r))); };
</script></body></html>
