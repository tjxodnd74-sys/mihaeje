<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:P;src:url(Pretendard-Black.woff2);font-weight:900}
@font-face{font-family:P;src:url(Pretendard-ExtraBold.woff2);font-weight:800}
*{margin:0;padding:0;box-sizing:border-box}body{width:2240px;height:1920px;background:#222;display:flex;gap:80px;font-family:P;word-break:keep-all}
.f{position:relative;width:1080px;height:1920px;overflow:hidden;background:#000;color:#fff}
.st{-webkit-text-stroke:14px #000;paint-order:stroke fill}
/* A: 쇼츠 뉴스형 */
.A .t{position:absolute;top:170px;left:0;right:0;text-align:center;font-weight:900;line-height:1.15;letter-spacing:-.04em}
.A .t1{font-size:88px}.A .t2{font-size:104px;color:#ffe14a}
.A img{position:absolute;top:500px;left:0;width:1080px;height:810px;object-fit:cover}
.A .big{position:absolute;top:780px;left:0;right:0;text-align:center;font-size:200px;font-weight:900;color:#ff2b2b;letter-spacing:-.05em;-webkit-text-stroke:18px #fff;paint-order:stroke fill;text-shadow:0 10px 30px rgba(0,0,0,.6)}
.A .cap{position:absolute;top:1390px;left:0;right:0;text-align:center;font-size:80px;font-weight:900;letter-spacing:-.04em}
.A .cap em{font-style:normal;color:#ffe14a}
/* B: 꽉찬 밈형 */
.B img{position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover;object-position:45% 50%;filter:brightness(.8)}
.B .t{position:absolute;top:150px;left:0;right:0;text-align:center;font-weight:900;line-height:1.15;letter-spacing:-.04em}
.B .t1{font-size:84px}.B .t2{font-size:100px;color:#ffe14a}
.B .big{position:absolute;top:900px;left:0;right:0;text-align:center;font-size:190px;font-weight:900;color:#ff2b2b;letter-spacing:-.05em;-webkit-text-stroke:18px #fff;paint-order:stroke fill}
.B .cap{position:absolute;top:1420px;left:0;right:0;text-align:center;font-size:86px;font-weight:900;letter-spacing:-.04em}
.B .cap em{font-style:normal;color:#ffe14a}
.lab{position:absolute;left:30px;bottom:30px;font-size:70px;font-weight:900;background:#ffe14a;color:#000;padding:6px 24px;border-radius:10px}
</style></head><body>
<div class="f A"><div class="t"><div class="t1 st">먼저 산 사람만 손해</div><div class="t2 st">신형 아반떼 근황</div></div>
<img src="../20261109_avante/web/a00.jpg"><div class="big">-100만 원</div><div class="cap st">나온 지 <em>석 달</em> 만에</div><div class="lab">A</div></div>
<div class="f B"><img src="../20261109_avante/web/a00.jpg"><div class="t"><div class="t1 st">먼저 산 사람만 손해</div><div class="t2 st">신형 아반떼 근황</div></div>
<div class="big">-100만 원</div><div class="cap st">나온 지 <em>석 달</em> 만에</div><div class="lab">B</div></div>
</body></html>
