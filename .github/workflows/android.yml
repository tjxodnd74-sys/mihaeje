# 미해제 안드로이드 앱 빌드
# main 에 mystery-app/ 이나 mystery-site/web/ 이 바뀌면 돈다 (Actions 탭에서 손으로 돌릴 수도 있음)
# 결과물(Actions 실행 화면 아래 Artifacts):
#   - mihaeje-debug-apk : 휴대폰에 바로 설치해 보는 테스트용 APK
#   - mihaeje-release-aab : 구글 플레이에 올리는 파일 (서명 키 Secrets 가 있으면 서명됨, 없으면 서명 안 됨)
# 서명 키 Secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# (만드는 법은 mystery-app/README.md)
name: Android app

on:
  push:
    branches: [main]
    paths:
      - 'mystery-app/**'
      - 'mystery-site/web/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 저장소에 다른 프로젝트 폴더도 있어서 앱에 필요한 두 폴더만 받는다
          sparse-checkout: |
            mystery-site
            mystery-app

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # GitHub 러너에 이미 깔린 Android SDK 를 그대로 쓴다 (라이선스 동의 단계를 따로 두지 않음)

      - uses: gradle/actions/setup-gradle@v4

      - name: 웹 게임 빌드 (mystery-site → dist/client)
        working-directory: mystery-site
        run: |
          npm ci
          npm run build

      - name: 앱에 웹 넣기 (Capacitor sync)
        working-directory: mystery-app
        run: |
          npm ci
          npm run sync

      - name: 서명 키 준비 (Secrets 가 있을 때만)
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-key.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload-key.jks" >> "$GITHUB_ENV"

      - name: APK·AAB 만들기
        working-directory: mystery-app/android
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleRelease

      - name: 서명 키 지우기
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-key.jks"

      - name: 테스트용 APK 올리기
        uses: actions/upload-artifact@v4
        with:
          name: mihaeje-debug-apk
          path: mystery-app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 플레이 스토어용 AAB 올리기
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.HAS_SIGNING_KEY == 'true' && 'mihaeje-release-aab' || 'mihaeje-release-aab-unsigned' }}
          path: mystery-app/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: 요약
        run: |
          {
            echo "## 미해제 앱 빌드 #${{ github.run_number }}"
            echo ""
            echo "- 버전 번호(versionCode): ${{ github.run_number }} 이상"
            if [ "$HAS_SIGNING_KEY" = "true" ]; then
              echo "- AAB: 서명됨 → 플레이 콘솔에 바로 올릴 수 있음"
            else
              echo "- AAB: 서명 안 됨 (서명 키 Secrets 가 없음) → 플레이 콘솔에 올리려면 README 의 '서명 키' 단계를 먼저"
            fi
            echo "- 테스트용 APK: 아래 Artifacts 의 mihaeje-debug-apk"
            ls -la mystery-app/android/app/build/outputs/apk/debug/ mystery-app/android/app/build/outputs/bundle/release/ | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"
