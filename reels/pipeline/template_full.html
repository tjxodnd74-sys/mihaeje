<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
@font-face{font-family:P;src:url(fonts/Pretendard-Black.woff2) format("woff2");font-weight:900}
@font-face{font-family:P;src:url(fonts/Pretendard-ExtraBold.woff2) format("woff2");font-weight:800}
@font-face{font-family:P;src:url(fonts/Pretendard-Bold.woff2) format("woff2");font-weight:700}
@font-face{font-family:P;src:url(fonts/Pretendard-Medium.woff2) format("woff2");font-weight:500}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:transparent;font-family:P,"Noto Sans CJK KR",sans-serif;color:#fff}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden}
/* soft darkening top & bottom so text reads on any footage */
#gradTop{position:absolute;left:0;top:0;width:1080px;height:520px;background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,0))}
#gradBot{position:absolute;left:0;bottom:0;width:1080px;height:760px;background:linear-gradient(0deg,rgba(0,0,0,.72) 0%,rgba(0,0,0,.35) 55%,rgba(0,0,0,0) 100%)}
#vig{position:absolute;inset:0;box-shadow:inset 0 0 260px rgba(0,0,0,.55)}
/* top: tiny label + step dots */
#top{position:absolute;left:64px;right:64px;top:96px;display:flex;align-items:center;justify-content:space-between}
#label{display:flex;align-items:center;gap:14px;font-size:28px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
#label i{display:block;width:34px;height:3px;background:#ffd64f}
#dots{display:flex;gap:10px}
#dots b{display:block;width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.35)}
#dots b.on{background:#ffd64f}
/* step tag (left, mid) */
#tag{position:absolute;left:64px;top:1080px;display:flex;align-items:baseline;gap:18px;opacity:0}
#tag .n{font-size:48px;font-weight:800;color:#ffd64f;letter-spacing:.02em}
#tag .t{font-size:60px;font-weight:800;letter-spacing:-.02em}
#tag .ln{position:absolute;left:0;bottom:-16px;height:4px;background:#ffd64f;width:0}
/* big stat */
#stat{position:absolute;left:64px;top:1150px;opacity:0}
#stat .big{font-size:168px;font-weight:900;line-height:.95;letter-spacing:-.05em;color:#ffd64f;text-shadow:0 10px 40px rgba(0,0,0,.55)}
#stat .sub{font-size:38px;font-weight:700;margin-top:14px;opacity:.9}
/* hook: big centered */
#hook{position:absolute;left:64px;right:64px;top:0;height:1920px;display:flex;align-items:center;justify-content:center;text-align:center;opacity:0}
#hook div{font-size:112px;font-weight:900;line-height:1.12;letter-spacing:-.035em;text-shadow:0 12px 50px rgba(0,0,0,.6);word-break:keep-all}
#hook .w{display:inline-block;margin-right:.18em}
#hook .hl{color:#ffd64f}
/* caption */
/* caption: one short chunk at a time, centred, synced to narration */
#cap{position:absolute;left:40px;right:40px;top:1440px;height:200px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:84px;line-height:1.15;font-weight:900;letter-spacing:-.03em;word-break:keep-all;white-space:nowrap;
  -webkit-text-stroke:10px rgba(0,0,0,.85);paint-order:stroke fill;text-shadow:0 6px 24px rgba(0,0,0,.55)}
#cap .w{margin-right:.22em}
#cap .w:last-child{margin-right:0}
#cap .hl{color:#ffd64f}
/* cta */
#cta{position:absolute;left:64px;right:64px;top:1180px;display:flex;flex-direction:column;gap:18px;opacity:0}
#cta .r{display:flex;align-items:center;gap:20px;font-size:58px;font-weight:800;letter-spacing:-.02em}
#cta .r b{width:56px;height:56px;border-radius:14px;background:#ffd64f;display:flex;align-items:center;justify-content:center;flex:none}
#cta .r b svg{width:36px;height:36px}
/* era (history series): big year + generation label, rolls between years */
#era{position:absolute;left:0;right:0;top:205px;text-align:center;opacity:0}
#era .y{font-size:200px;font-weight:900;line-height:1;letter-spacing:-.04em;color:#ffd64f;text-shadow:0 10px 40px rgba(0,0,0,.55);font-variant-numeric:tabular-nums}
#era .g{display:inline-block;margin-top:14px;font-size:54px;font-weight:800;letter-spacing:-.02em;padding:6px 26px;border-radius:14px;background:rgba(255,255,255,.12)}
#bar{position:absolute;left:0;bottom:0;width:1080px;height:8px;background:rgba(255,255,255,.15)}
#bar i{display:block;height:100%;background:#ffd64f;width:0}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
</style></head>
<body><div id="stage">
  <div id="gradTop"></div><div id="gradBot"></div><div id="vig"></div>
  <div id="top"><div id="label"><i></i><span id="labeltxt"></span></div><div id="dots"><b id="d1"></b><b id="d2"></b><b id="d3"></b></div></div>
  <div id="hook"><div id="hookin"></div></div>
  <div id="tag"><span class="n" id="tagn"></span><span class="t" id="tagt"></span><span class="ln" id="tagln"></span></div>
  <div id="stat"><div class="big" id="statbig"></div><div class="sub" id="statsub"></div></div>
  <div id="cta"></div>
  <div id="era"><div class="y" id="eray"></div><div class="g" id="erag"></div></div>
  <div id="cap"></div>
  <div id="bar"><i id="barfill"></i></div>
  <div id="flash"></div>
</div>
<script>
const SPEC=window.SPEC;const SEG=SPEC.segments;
const $=id=>document.getElementById(id);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const eo=x=>1-Math.pow(1-x,3);
const back=x=>{const c=1.4;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
$('labeltxt').textContent=SPEC.eyebrow;
if(SPEC.noDots)$('dots').style.display='none';
function buildCap(str){let on=false;return str.split(' ').map(w=>{if(w==='/')return '<br>';const start=w.startsWith('|');if(start)on=true;const hl=on||w.includes('|');const n=(w.match(/\|/g)||[]).length;w=w.replace(/\|/g,'');if(n===2||(!start&&n===1))on=false;return `<span class="w${hl?' hl':''}">${w}</span>`;}).join('');}
$('cta').innerHTML=SPEC.cta.map((c,i)=>`<div class="r" id="ctar${i}"><b><svg viewBox="0 0 24 24" fill="none" stroke="#0b1220" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></b><span>${c}</span></div>`).join('');
// split a caption into short chunks (≈12 chars, never mid-word). " / " forces a break; commas prefer a break.
const CMAX=SPEC.capMax||12;const _chunkCache={};
function chunksOf(i){
  if(_chunkCache[i])return _chunkCache[i];
  let on=false;const toks=[];
  SEG[i].cap.split(' ').forEach(w=>{if(w==='/'){toks.push({br:1});return;}const start=w.startsWith('|');if(start)on=true;const hl=on||w.includes('|');const n=(w.match(/\|/g)||[]).length;w=w.replace(/\|/g,'');if(n===2||(!start&&n===1))on=false;if(w)toks.push({w,hl});});
  const groups=[];let cur=[],len=0;
  const flush=()=>{if(cur.length)groups.push(cur);cur=[];len=0;};
  toks.forEach(t=>{if(t.br){flush();return;}const l=t.w.length;if(cur.length&&len+l>CMAX)flush();cur.push(t);len+=l;if(/[,，]$/.test(t.w)&&len>=4)flush();});
  flush();
  // merge a tiny trailing chunk (≤3 chars) back into the previous one
  if(groups.length>1){const last=groups[groups.length-1];if(last.reduce((a,t)=>a+t.w.length,0)<=3){groups[groups.length-2].push(...last);groups.pop();}}
  const lens=groups.map(g=>g.reduce((a,t)=>a+t.w.replace(/[,.!?]/g,'').length,0)+0.5);
  const tot=lens.reduce((a,b)=>a+b,0);let acc=0;const at=lens.map(l=>{const v=acc/tot;acc+=l;return v;});
  const list=groups.map(g=>g.map(t=>`<span class="w${t.hl?' hl':''}">${t.w.replace(/,$/,'')}</span>`).join(''));
  return _chunkCache[i]={list,at};
}
let curStep=0;
window.seek=function(t){
  let seg=null,si=-1;for(let i=0;i<SEG.length;i++){if(t>=SEG[i].t){seg=SEG[i];si=i;}}
  // cut flash (very short, subtle) at each segment that starts a new clip
  let fl=0;if(seg&&seg.cut){const d=t-seg.t;if(d>=0&&d<0.08)fl=(1-d/0.08)*0.18;}
  $('flash').style.opacity=fl;
  $('barfill').style.width=(clamp(t/SPEC.duration,0,1)*100)+'%';
  const e=eo(clamp((t-0.1)/0.5,0,1));$('top').style.opacity=e;$('top').style.transform=`translateY(${(1-e)*-16}px)`;
  if(seg&&seg.step)curStep=seg.step;
  for(let i=1;i<=3;i++)$('d'+i).classList.toggle('on',curStep>=i);
  const hook=$('hook'),tag=$('tag'),stat=$('stat'),cta=$('cta'),cap=$('cap');
  hook.style.opacity=0;tag.style.opacity=0;stat.style.opacity=0;cta.style.opacity=0;cap.style.opacity=1;
  $('era').style.opacity=0;
  if(!seg){cap.innerHTML='';return;}
  const d=t-seg.t;
  if(seg.year){ // history: year rolls up from the previous era's year
    const prev=SEG.slice(0,si).reverse().find(s=>s.year);const from=prev?+prev.year:+seg.year,to=+seg.year;
    const p=eo(clamp((d-0.05)/0.6,0,1));$('eray').textContent=Math.round(from+(to-from)*p);$('erag').textContent=seg.gen||'';
    const first=!prev||(SEG[si-1]&&!SEG[si-1].year);const k=first?eo(clamp(d/0.4,0,1)):1;
    $('era').style.opacity=k;$('era').style.transform=`translateY(${(1-k)*-30}px)`;
  }
  if(seg.kin){ // hook: big centered sentence, words rise in; no bottom caption
    if(hook.dataset.k!==String(seg.t)){$('hookin').innerHTML=buildCap(seg.cap);hook.dataset.k=String(seg.t);}
    hook.style.opacity=1-eo(clamp((t-seg.e+0.25)/0.25,0,1));cap.style.opacity=0;
    [...$('hookin').querySelectorAll('.w')].forEach((w,i)=>{const k=eo(clamp((d-i*0.07)/0.45,0,1));w.style.transform=`translateY(${(1-k)*50}px)`;w.style.opacity=k;});
    return;
  }
  // caption (bottom): show one short chunk at a time, timed by character share of the sentence
  // chunk times come from build.py (seg.capChunks, aligned to the narration); fallback: character share
  let list,starts;
  if(seg.capChunks){list=seg.capChunks.map(c=>c.html);starts=seg.capChunks.map(c=>c.t);}
  else{const ch=chunksOf(si);const sEnd=(si===SEG.length-1)?seg.e-1.8:seg.e-0.3, span=Math.max(0.6,sEnd-seg.t-0.05);list=ch.list;starts=ch.at.map(a=>seg.t+0.05+span*a);}
  let ci=0;for(let j=0;j<list.length;j++){if(t>=starts[j])ci=j;}
  const key=seg.t+':'+ci;
  if(cap.dataset.k!==key){cap.innerHTML=list[ci];cap.dataset.k=key;let fs=84;cap.style.fontSize=fs+'px';while(cap.scrollWidth>cap.clientWidth+1&&fs>54){fs-=4;cap.style.fontSize=fs+'px';}}
  const cd=t-starts[ci];const k=eo(clamp(cd/0.14,0,1));
  cap.style.opacity=clamp(cd/0.06+0.001,0,1);cap.style.transform=`scale(${0.94+0.06*k})`;
  // step tag persists through the step + its detail
  const stepSeg=[...SEG].reverse().find(s=>s.step&&t>=s.t);
  if(stepSeg&&!seg.cta){
    $('tagn').textContent=stepSeg.num;$('tagt').textContent=stepSeg.name;
    const k=eo(clamp((t-stepSeg.t)/0.45,0,1));tag.style.opacity=k;tag.style.transform=`translateX(${(1-k)*-40}px)`;
    $('tagln').style.width=(k*100)+'%';
    if(seg.stat){tag.style.transform+=' translateY(-110px)';}
  }
  if(seg.stat){
    const p=eo(clamp((d-0.1)/0.9,0,1));
    if(seg.count){const [to,unit,pre]=seg.count;$('statbig').textContent=`${pre}${Math.round(to*p)}${unit}`;}else{$('statbig').textContent=seg.stat[0];}$('statsub').textContent=seg.stat[1];
    const k=back(clamp(d/0.5,0,1));stat.style.opacity=clamp(d/0.12,0,1);stat.style.transform=`translateY(${(1-k)*30}px)`;
  }
  if(seg.cta){
    cta.style.opacity=1;
    SPEC.cta.forEach((c,i)=>{const r=$('ctar'+i);const k=back(clamp((d-0.15-i*0.3)/0.45,0,1));r.style.opacity=clamp(k*1.5,0,1);r.style.transform=`translateX(${(1-k)*-50}px)`;});
  }
};
seek(0);
</script></body></html>
