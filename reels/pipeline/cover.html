<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
@font-face{font-family:P;src:url(fonts/Pretendard-Black.woff2) format("woff2");font-weight:900}
@font-face{font-family:P;src:url(fonts/Pretendard-ExtraBold.woff2) format("woff2");font-weight:800}
@font-face{font-family:P;src:url(fonts/Pretendard-Bold.woff2) format("woff2");font-weight:700}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;font-family:P,"Noto Sans CJK KR",sans-serif;color:#fff;background:#0b1220}
.ph{position:absolute;inset:0;background-size:cover;background-position:center}
.sh{position:absolute;inset:0;background:radial-gradient(ellipse at 40% 50%,rgba(0,0,0,.38) 0%,rgba(0,0,0,.1) 75%),linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,0) 30%,rgba(0,0,0,0) 70%,rgba(0,0,0,.45))}
/* everything important lives in the centre 1080x1080 so the profile grid (3:4) and feed crops keep it */
.box{position:absolute;left:70px;right:70px;top:500px;height:920px;display:flex;flex-direction:column;justify-content:center}
.tag{align-self:flex-start;background:#ffd64f;color:#0b1220;font-size:44px;font-weight:900;padding:12px 26px;border-radius:14px;letter-spacing:-.01em;margin-bottom:34px}
h1{font-size:150px;line-height:1.04;font-weight:900;letter-spacing:-.045em;text-shadow:0 10px 40px rgba(0,0,0,.65);word-break:keep-all}
h1 em{font-style:normal;color:#ffd64f}
.sub{margin-top:36px;font-size:50px;font-weight:800;letter-spacing:-.02em;text-shadow:0 4px 20px rgba(0,0,0,.7)}
.sub em{font-style:normal;color:#ffd64f}
</style></head><body>
<div class="ph" id="ph"></div><div class="sh"></div>
<div class="box"><div class="tag" id="tag"></div><h1 id="h"></h1><div class="sub" id="s"></div></div>
<script>
const C=window.COVER;document.getElementById('ph').style.backgroundImage=`url('${C.photo}')`;
if(C.boxTop!=null){const b=document.querySelector('.box');b.style.top=C.boxTop+'px';b.style.height=(C.boxH||620)+'px';}
const hl=s=>s.replace(/\|([^|]+)\|/g,'<em>$1</em>');
document.getElementById('tag').textContent=C.tag;document.getElementById('h').innerHTML=hl(C.title);document.getElementById('s').innerHTML=hl(C.sub||'');
</script></body></html>
