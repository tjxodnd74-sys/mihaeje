<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
@font-face{font-family:P;src:url(fonts/Pretendard-Black.woff2) format("woff2");font-weight:900}
@font-face{font-family:P;src:url(fonts/Pretendard-ExtraBold.woff2) format("woff2");font-weight:800}
@font-face{font-family:P;src:url(fonts/Pretendard-Bold.woff2) format("woff2");font-weight:700}
@font-face{font-family:P;src:url(fonts/Pretendard-Medium.woff2) format("woff2");font-weight:500}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0b1220;font-family:P,"Noto Sans CJK KR",sans-serif;color:#fff}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;will-change:transform}
#bg,#bg2{position:absolute;inset:0}
#bg2{clip-path:circle(0px at 540px 960px)}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 2px,transparent 2.5px);background-size:48px 48px;opacity:.9}
#top{position:absolute;left:72px;top:88px;right:72px;display:flex;align-items:center;justify-content:space-between;z-index:5}
#eyebrow{display:flex;align-items:center;gap:14px;font-size:30px;font-weight:700;letter-spacing:.02em;opacity:.85}
#eyebrow .dot{width:14px;height:14px;border-radius:50%;background:currentColor}
#steps{display:flex;gap:12px}
.pill{width:60px;height:60px;border-radius:50%;border:4px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:rgba(255,255,255,.45)}
.pill.on{border-color:#fff;background:#fff;color:#0b1220}
#title{position:absolute;left:72px;top:190px;right:72px;font-size:88px;line-height:1.08;font-weight:900;letter-spacing:-.03em;z-index:5}
#title .w{display:inline-block;will-change:transform}
#title .accent{color:var(--acc)}
#art{position:absolute;left:0;top:560px;width:1080px;height:820px;z-index:4}
#art svg{position:absolute;left:0;top:0;width:1080px;height:820px;overflow:visible}
#kin{position:absolute;left:72px;right:72px;top:560px;height:420px;display:flex;flex-wrap:wrap;align-content:center;gap:0 24px;z-index:6}
#kin .kw{font-size:140px;font-weight:900;line-height:1.05;letter-spacing:-.04em;will-change:transform}
#kin .kw.y{color:var(--acc)}
#statbox{position:absolute;left:72px;right:72px;top:1250px;z-index:6;text-align:left}
#statbig{font-size:170px;font-weight:900;line-height:.95;letter-spacing:-.05em;color:var(--acc)}
#statsub{display:inline-block;margin-top:18px;font-size:40px;font-weight:700;padding:10px 26px;border-radius:14px;background:rgba(255,255,255,.12);color:#fff}
#stepnum{position:absolute;left:72px;top:600px;font-size:300px;font-weight:900;line-height:1;letter-spacing:-.06em;color:var(--acc);z-index:6;opacity:0}
#stepname{position:absolute;left:72px;top:900px;font-size:120px;font-weight:900;letter-spacing:-.03em;z-index:6;opacity:0;line-height:1.05}
#capwrap{position:absolute;left:72px;right:72px;top:1540px;z-index:6}
#cap{font-size:60px;line-height:1.3;font-weight:800;word-break:keep-all;letter-spacing:-.01em}
#cap .w{display:inline-block;margin-right:.22em;will-change:transform}
#cap .hl{color:var(--acc)}
#bar{position:absolute;left:72px;right:72px;bottom:90px;height:10px;border-radius:5px;background:rgba(255,255,255,.14);overflow:hidden;z-index:6}
#bar i{display:block;height:100%;background:var(--acc);width:0}
#cta{position:absolute;left:72px;right:72px;top:600px;height:760px;display:flex;flex-direction:column;justify-content:center;gap:26px;z-index:6}
#cta .row{display:flex;align-items:center;gap:28px;font-size:72px;font-weight:900;letter-spacing:-.02em}
#cta .chk{width:92px;height:92px;border-radius:24px;border:6px solid var(--acc);display:flex;align-items:center;justify-content:center;flex:none}
#cta .chk svg{width:60px;height:60px}
#flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:30}
</style></head>
<body><div id="stage">
  <div id="bg"></div><div id="bg2"></div><div class="dots"></div>
  <div id="top"><div id="eyebrow"><span class="dot"></span><span id="eyebrowtxt"></span></div>
    <div id="steps"><div class="pill" id="p1">1</div><div class="pill" id="p2">2</div><div class="pill" id="p3">3</div></div></div>
  <div id="title"></div>
  <div id="art"></div>
  <div id="kin"></div>
  <div id="stepnum">01</div><div id="stepname"></div>
  <div id="statbox"><div id="statbig"></div><div><span id="statsub"></span></div></div>
  <div id="cta"></div>
  <div id="capwrap"><div id="cap"></div></div>
  <div id="bar"><i id="barfill"></i></div>
  <div id="flash"></div>
</div>
<script>
const SPEC=window.SPEC;const SEG=SPEC.segments;
const PAL=[['#0b1220','#ffd64f'],['#1a1430','#ffb347'],['#0c2340','#4fd1ff'],['#0f2a26','#3ddc97'],['#0b1220','#ffd64f']];
const $=id=>document.getElementById(id);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const eo=x=>1-Math.pow(1-x,3);
const back=x=>{const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const el=x=>x<=0?0:x>=1?1:Math.pow(2,-10*x)*Math.sin((x*10-0.75)*(2*Math.PI/3))+1;
const lerp=(a,b,k)=>a+(b-a)*k;
// scenes: index of palette per segment (hook 0, step n → n, cta 4)
function sceneOf(seg){if(seg.cta)return 4;if(seg.step)return seg.step;return null;}
let scenes=[];{let cur=0;for(const s of SEG){const sc=sceneOf(s);if(sc!==null)cur=sc;scenes.push(cur);}}
$('eyebrowtxt').textContent=SPEC.eyebrow;
$('title').innerHTML=SPEC.title.map(w=>w[0]==='BR'?'<br>':`<span class="w${w[1]?' accent':''}">${w[0]}</span> `).join('');
const titleW=[...document.querySelectorAll('#title .w')];
function buildCap(str){let on=false;return str.split(' ').map(w=>{const start=w.startsWith('|');if(start)on=true;const hl=on||w.includes('|');const n=(w.match(/\|/g)||[]).length;w=w.replace(/\|/g,'');if(n===2||(!start&&n===1))on=false;return `<span class="w${hl?' hl':''}">${w}</span>`;}).join('');}
$('cta').innerHTML=SPEC.cta.map((c,i)=>`<div class="row" id="ctar${i}"><div class="chk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path id="ctap${i}" d="M5 13l4 4L19 7"/></svg></div><span>${c}</span></div>`).join('');

// ---------- vector art per icon ----------
const NS='http://www.w3.org/2000/svg';
function svg(inner){return `<svg viewBox="0 0 1080 820">${inner}</svg>`;}
const ART={
 // CAR for hook: side-view car, wheels rotate, moves in
 hook:()=>svg(`<g id="car"><g transform="translate(140,480)">
   <path d="M60 230 L120 120 Q140 90 180 90 L520 90 Q580 90 620 130 L700 220 L780 240 Q820 250 820 290 L820 330 Q820 350 800 350 L60 350 Q40 350 40 330 L40 260 Q40 235 60 230 Z" fill="var(--acc)"/>
   <path d="M150 215 L200 130 Q210 118 225 118 L380 118 L380 215 Z" fill="#0b1220" opacity=".85"/>
   <path d="M415 118 L560 118 Q585 118 600 140 L660 215 L415 215 Z" fill="#0b1220" opacity=".85"/>
   <rect x="690" y="262" width="80" height="28" rx="10" fill="#fff" opacity=".9"/>
   <g id="w1" transform="translate(190,350)"><circle r="78" fill="#0b1220"/><circle r="46" fill="#cbd5e1"/><circle r="12" fill="#0b1220"/><path d="M-40 0H40M0 -40V40M-28 -28L28 28M28 -28L-28 28" stroke="#0b1220" stroke-width="12"/></g>
   <g id="w2" transform="translate(650,350)"><circle r="78" fill="#0b1220"/><circle r="46" fill="#cbd5e1"/><circle r="12" fill="#0b1220"/><path d="M-40 0H40M0 -40V40M-28 -28L28 28M28 -28L-28 28" stroke="#0b1220" stroke-width="12"/></g>
 </g></g>
 <g id="road"><rect x="0" y="850" width="1080" height="10" rx="5" fill="#fff" opacity=".25"/><g id="dash"></g></g>
 <g id="flakes"></g>`),
 battery:()=>svg(`<g transform="translate(140,180)">
   <rect x="0" y="60" width="700" height="360" rx="48" fill="none" stroke="#fff" stroke-width="22"/>
   <rect x="720" y="170" width="70" height="140" rx="20" fill="#fff"/>
   <g id="cells"><rect id="c0" x="60" y="120" width="180" height="240" rx="24" fill="var(--acc)"/><rect id="c1" x="260" y="120" width="180" height="240" rx="24" fill="var(--acc)"/><rect id="c2" x="460" y="120" width="180" height="240" rx="24" fill="var(--acc)"/></g>
   <g id="yrs" font-family="P" font-weight="900" font-size="64" fill="#0b1220" text-anchor="middle"><text id="y0" x="150" y="262">1년</text><text id="y1" x="350" y="262">2년</text><text id="y2" x="550" y="262">3년</text></g>
   <g id="bolt" opacity="0"><path d="M400 500 L340 620 L400 620 L370 740 L470 580 L410 580 Z" fill="var(--acc)"/></g>
 </g>`),
 tire:()=>svg(`<g id="tireg" transform="translate(330,420)">
   <circle id="tire" r="260" fill="#111827" stroke="#fff" stroke-width="18"/>
   <circle r="150" fill="#cbd5e1"/><circle r="44" fill="#111827"/>
   <g stroke="#111827" stroke-width="26" stroke-linecap="round"><path d="M0 -120V-60M0 60V120M-120 0H-60M60 0H120"/></g>
 </g>
 <g transform="translate(700,160)">
   <rect x="0" y="0" width="60" height="420" rx="30" fill="none" stroke="#fff" stroke-width="12"/>
   <rect id="merc" x="14" y="200" width="32" height="200" rx="16" fill="var(--acc)"/>
   <circle cx="30" cy="440" r="56" fill="var(--acc)"/>
   <text id="temp" x="130" y="300" font-family="P" font-weight="900" font-size="88" fill="#fff">20℃</text>
 </g>
 <g transform="translate(720,560)">
   <path d="M0 160 A160 160 0 0 1 320 160" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round"/>
   <line id="needle" x1="160" y1="160" x2="160" y2="30" stroke="var(--acc)" stroke-width="16" stroke-linecap="round" transform="rotate(60 160 160)"/>
   <circle cx="160" cy="160" r="22" fill="#fff"/>
   <text id="psi" x="160" y="230" font-family="P" font-weight="900" font-size="56" fill="#fff" text-anchor="middle">36 psi</text>
 </g>`),
 washer:()=>svg(`<g transform="translate(120,120)">
   <g id="bottle" transform="rotate(0 200 300)">
     <rect x="100" y="60" width="200" height="60" rx="14" fill="#fff"/>
     <path d="M80 130 L320 130 L340 560 Q340 600 300 600 L100 600 Q60 600 60 560 Z" fill="none" stroke="#fff" stroke-width="18"/>
     <path id="liq" d="M72 340 L328 340 L340 560 Q340 600 300 600 L100 600 Q60 600 60 560 Z" fill="var(--acc)"/>
     <text x="200" y="490" font-family="P" font-weight="900" font-size="60" fill="#0b1220" text-anchor="middle">겨울용</text>
   </g>
   <g id="pour" opacity="0"><path d="M340 160 Q520 200 600 360" fill="none" stroke="var(--acc)" stroke-width="22" stroke-linecap="round"/></g>
   <g transform="translate(560,120)">
     <rect x="0" y="0" width="60" height="420" rx="30" fill="none" stroke="#fff" stroke-width="12"/>
     <rect id="merc2" x="14" y="200" width="32" height="200" rx="16" fill="#4fd1ff"/>
     <circle cx="30" cy="440" r="56" fill="#4fd1ff"/>
     <text id="temp2" x="110" y="300" font-family="P" font-weight="900" font-size="88" fill="#fff">0℃</text>
   </g>
   <g id="ice" opacity="0" transform="translate(520,520)"><path d="M0 0 L60 0 M30 -30 L30 30 M8 -22 L52 22 M52 -22 L8 22" stroke="#4fd1ff" stroke-width="10" stroke-linecap="round"/></g>
 </g>`),
 generic:()=>svg(`<g transform="translate(540,410)"><circle id="ring" r="220" fill="none" stroke="var(--acc)" stroke-width="28" stroke-dasharray="1382" stroke-dashoffset="1382" transform="rotate(-90)"/><path d="M-90 10 L-30 70 L100 -70" fill="none" stroke="#fff" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" id="gchk" stroke-dasharray="300" stroke-dashoffset="300"/></g>`),
};
let artKey=null;
function setArt(k){if(artKey===k)return;$('art').innerHTML=ART[k]?ART[k]():ART.generic();artKey=k;
  if(k==='hook'){const d=$('dash');let s='';for(let i=0;i<8;i++)s+=`<rect x="${i*160}" y="850" width="80" height="10" rx="5" fill="#fff" opacity=".5"/>`;d.innerHTML=s;
    const f=$('flakes');let t='';for(let i=0;i<14;i++)t+=`<circle class="fl" cx="${(i*83)%1080}" cy="${(i*131)%600}" r="${6+(i%4)*3}" fill="#fff" opacity=".5"/>`;f.innerHTML=t;}}

let curStep=0;
window.seek=function(t){
  let seg=null,si=-1;for(let i=0;i<SEG.length;i++){if(t>=SEG[i].t){seg=SEG[i];si=i;}}
  const scene=si<0?0:scenes[si];const [bg,acc]=PAL[scene];
  document.documentElement.style.setProperty('--acc',acc);
  // background with circle wipe at scene change
  let prevScene=scene;for(let i=si-1;i>=0;i--){if(scenes[i]!==scene){prevScene=scenes[i];break;}}
  let wipeStart=null;for(let i=si;i>=0;i--){if(scenes[i]===scene&&(i===0||scenes[i-1]!==scene)){wipeStart=SEG[i].t;break;}}
  const wk=wipeStart==null?1:eo(clamp((t-wipeStart)/0.55,0,1));
  $('bg').style.background=PAL[prevScene][0];$('bg2').style.background=bg;$('bg2').style.clipPath=`circle(${wk*1300}px at 540px 960px)`;
  // flash + shake at scene change
  const dSc=wipeStart==null?9:t-wipeStart;let sx=0,sy=0;
  if(dSc>=0&&dSc<0.4){const k=Math.exp(-dSc*10)*Math.sin(dSc*55);sx=k*14;sy=k*9;}
  $('stage').style.transform=`translate(${sx}px,${sy}px)`;$('flash').style.opacity=dSc>=0&&dSc<0.12&&scene!==0?(1-dSc/0.12)*0.35:0;
  // header
  titleW.forEach((w,i)=>{const k=back(clamp((t-0.15-i*0.08)/0.45,0,1));w.style.transform=`translateY(${(1-k)*60}px)`;w.style.opacity=clamp(k*1.5,0,1);});
  const e=eo(clamp((t-0.05)/0.4,0,1));$('eyebrow').style.opacity=e*0.85;$('steps').style.opacity=eo(clamp((t-0.5)/0.4,0,1));
  if(seg&&seg.step)curStep=seg.step;
  for(let i=1;i<=3;i++){const p=$('p'+i);p.classList.toggle('on',curStep>=i);const s=SEG.find(x=>x.step===i);p.style.transform=(s&&t>=s.t)?`scale(${0.7+0.3*el(clamp((t-s.t)/0.8,0,1))+ (1-el(clamp((t-s.t)/0.8,0,1)))*0.5})`:'';}
  $('barfill').style.width=(clamp(t/SPEC.duration,0,1)*100)+'%';
  // caption
  const cap=$('cap');
  if(seg){if(cap.dataset.k!==String(seg.t)){cap.innerHTML=buildCap(seg.cap);cap.dataset.k=String(seg.t);}
    [...cap.querySelectorAll('.w')].forEach((w,i)=>{const k=back(clamp((t-seg.t-i*0.05)/0.32,0,1));w.style.transform=`translateY(${(1-k)*34}px)`;w.style.opacity=clamp(k*1.5,0,1);});}
  else cap.innerHTML='';
  // what to show in the art area
  const kin=$('kin'),sn=$('stepnum'),sname=$('stepname'),sb=$('statbox'),cta=$('cta'),art=$('art');
  kin.style.opacity=0;sn.style.opacity=0;sname.style.opacity=0;sb.style.opacity=0;cta.style.opacity=0;art.style.opacity=0;
  if(!seg)return;
  const d=t-seg.t;
  if(seg.kin){ // HOOK: car drives in + kinetic words
    setArt('hook');art.style.opacity=1;
    const k=eo(clamp(d/1.0,0,1));const car=document.getElementById('car');
    car.setAttribute('transform',`translate(${lerp(-900,0,k)},${Math.sin(t*9)*3})`);
    const rot=t*520;document.getElementById('w1').setAttribute('transform',`translate(190,350) rotate(${rot})`);document.getElementById('w2').setAttribute('transform',`translate(650,350) rotate(${rot})`);
    document.getElementById('dash').setAttribute('transform',`translate(${-(t*600)%160},0)`);
    [...document.querySelectorAll('.fl')].forEach((f,i)=>{f.setAttribute('transform',`translate(${Math.sin(t+i)*20},${(t*90+i*40)%640})`);});
    if(kin.dataset.k!==String(seg.t)){kin.innerHTML=seg.kin.map(w=>`<span class="kw${w[2]?' y':''}">${w[0]}</span>`).join('');kin.dataset.k=String(seg.t);}
    kin.style.opacity=1;art.style.opacity=1;
    [...kin.children].forEach((w,i)=>{const at=seg.kin[i][1];const kk=back(clamp((t-at)/0.32,0,1));w.style.opacity=t>=at?1:0;w.style.transform=`translateY(${(1-kk)*60}px) scale(${0.6+0.4*kk})`;});
  } else if(seg.step){ // STEP INTRO: giant number + name + icon draws in
    setArt(seg.icon||'generic');art.style.opacity=0.22;
    const k1=el(clamp((d-0.15)/0.9,0,1)),k2=back(clamp((d-0.35)/0.45,0,1));
    sn.textContent=seg.num;sn.style.opacity=d>0.15?1:0;sn.style.transform=`translateX(${(1-k1)*-200}px) scale(${0.6+0.4*k1})`;
    sname.textContent=seg.name;sname.style.opacity=clamp(k2*1.5,0,1);sname.style.transform=`translateY(${(1-k2)*50}px)`;
  } else if(seg.stat){ // DETAIL: icon animation + big number
    setArt(seg.icon||iconOfStep(si));art.style.opacity=1;
    animateIcon(artKey,d,seg);
    const [to,unit,pre]=seg.count;const p=eo(clamp((d-0.2)/1.0,0,1));
    $('statbig').textContent=`${pre}${Math.round(to*p)}${unit}`;$('statsub').textContent=seg.stat[1];
    const k=el(clamp(d/0.9,0,1));sb.style.opacity=clamp(d/0.1,0,1);sb.style.transform=`translateY(${(1-k)*40}px)`;
    const ks=back(clamp((d-0.6)/0.4,0,1));$('statsub').style.opacity=clamp(ks,0,1);$('statsub').style.transform=`scale(${ks})`;
  } else if(seg.cta){ // CTA checklist
    cta.style.opacity=1;
    SPEC.cta.forEach((c,i)=>{const r=$('ctar'+i);const k=back(clamp((d-0.1-i*0.35)/0.5,0,1));r.style.opacity=clamp(k*1.5,0,1);r.style.transform=`translateX(${(1-k)*-80}px)`;
      const p=$('ctap'+i);const kk=eo(clamp((d-0.45-i*0.35)/0.35,0,1));p.setAttribute('stroke-dasharray','40');p.setAttribute('stroke-dashoffset',String(40*(1-kk)));});
  }
};
function iconOfStep(si){for(let i=si;i>=0;i--){if(SEG[i].step)return SEG[i].icon||'generic';}return 'generic';}
function animateIcon(k,d,seg){
  if(k==='battery'){ // cells fill 1년→2년→3년, third turns red & blinks, bolt
    for(let i=0;i<3;i++){const c=document.getElementById('c'+i);const kk=el(clamp((d-0.1-i*0.3)/0.6,0,1));c.setAttribute('transform',`translate(${150+i*200},240) scale(${kk}) translate(${-(150+i*200)},-240)`);
      const y=document.getElementById('y'+i);y.setAttribute('opacity',kk>0.6?1:0);}
    const c2=document.getElementById('c2');if(d>1.3){c2.setAttribute('fill',Math.floor(d*4)%2?'#ff6b57':'var(--acc)');}
    const b=document.getElementById('bolt');b.setAttribute('opacity',d>1.6?String(0.6+0.4*Math.sin(d*12)):'0');
  } else if(k==='tire'){ // temp drops 20→10, mercury down, needle drops, tire squashes
    const p=eo(clamp((d-0.2)/1.4,0,1));const temp=Math.round(20-10*p);document.getElementById('temp').textContent=temp+'℃';
    const m=document.getElementById('merc');m.setAttribute('y',String(200+120*p));m.setAttribute('height',String(200-120*p));
    document.getElementById('needle').setAttribute('transform',`rotate(${60-50*p} 160 160)`);document.getElementById('psi').textContent=(36-Math.round(p))+' psi';
    document.getElementById('tireg').setAttribute('transform',`translate(330,${420+18*p}) scale(${1+0.04*p},${1-0.07*p})`);
  } else if(k==='washer'){ // temp drops to -25, ice shows then bottle pours (winter fluid)
    const p=eo(clamp((d-0.1)/1.2,0,1));document.getElementById('temp2').textContent=(-Math.round(25*p))+'℃';
    const m=document.getElementById('merc2');m.setAttribute('y',String(200+180*p));m.setAttribute('height',String(200-180*p));
    document.getElementById('ice').setAttribute('opacity',p>0.9?String(0.6+0.4*Math.sin(d*8)):'0');
    const q=eo(clamp((d-1.3)/0.7,0,1));document.getElementById('bottle').setAttribute('transform',`rotate(${-35*q} 200 300)`);document.getElementById('pour').setAttribute('opacity',String(q));
  } else { // generic ring + check
    const p=eo(clamp(d/1.0,0,1));document.getElementById('ring').setAttribute('stroke-dashoffset',String(1382*(1-p)));
    const q=eo(clamp((d-0.7)/0.5,0,1));document.getElementById('gchk').setAttribute('stroke-dashoffset',String(300*(1-q)));
  }
}
seek(0);
</script></body></html>
