<script type="module">
import * as THREE from 'three';

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });

const wins = []; for (let r = 0; r < 5; r++) for (let c = 0; c < 12; c++) { const w = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 1.1), new THREE.MeshBasicMaterial({ color: 0x5b6b7d })); w.position.set(-14.3 + c * 2.6, 3 + r * 2.8, -8.98); scene.add(w); wins.push(w); }

for (let i = 0; i < 8; i++) { const t = new THREE.Mesh(new THREE.ConeGeometry(1.2, 3.6, 7), mat(0x4d7a52)); t.position.set(-16 + i * 4.6, 2.0, 16); t.castShadow = true; scene.add(t); const s = new THREE.Mesh(new THREE.ConeGeometry(0.9, 1.4, 7), mat(0xf4f7fa)); s.position.set(-16 + i * 4.6, 3.3, 16); scene.add(s); }

const loader = new GLTFLoader();
const load = f => new Promise(r => loader.load('glb/' + f, g => r(g.scene)));
const [CAR, C2, C3, C4] = await Promise.all(['sedan.glb', 'suv.glb', 'hatchback-sports.glb', 'van.glb'].map(load));
for (const c of [CAR, C2, C3, C4]) { c.scale.setScalar(1.9); c.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } }); scene.add(c); }
const bb = new THREE.Box3().setFromObject(CAR); const AL = bb.max.z - bb.min.z, AW = bb.max.x - bb.min.x, AH = bb.max.y - bb.min.y;
C2.position.set(-2 * SPX, 0, 0); C3.position.set(SPX, 0, 0); C4.position.set(2 * SPX, 0, 0);
// snow on roofs of other cars
for (const c of [C2, C3, C4]) { const b2 = new THREE.Box3().setFromObject(c); const s = box(AW * 0.62, 0.08, AL * 0.38, 0xf6f9fc, c.position.x, b2.max.y + 0.03, -0.1); }
// car materials (own copies, for x-ray)
const carMats = []; CAR.traverse(o => { if (o.isMesh) { o.material = o.material.clone(); carMats.push(o.material); } });

// engine bay
const eng = box(AW * 0.55, 0.32, AL * 0.2, 0x3a3d42, 0, AH * 0.3, FZ - AL * 0.2);
const glow = new THREE.Mesh(new THREE.SphereGeometry(0.75, 20, 14), new THREE.MeshBasicMaterial({ color: 0xff9a3c, transparent: true, opacity: 0, depthWrite: false })); glow.position.set(0, AH * 0.42, FZ - AL * 0.2); scene.add(glow);

  const tc2 = new THREE.CatmullRomCurve3([V(0, 0.2, -0.3), V(0.2, 0.15, -0.3), V(0.3, 0.12, -0.05), V(0.22, 0.12, 0.2)]);

  const u = c.userData; u.legs.forEach((l, i) => { l.visible = !lying; l.rotation.x = run ? Math.sin(t * 22 + (i % 2 ? 0 : Math.PI) + (i > 1 ? Math.PI / 2 : 0)) * 0.7 : 0; });

  const dy = lying ? -0.13 : 0; u.body.position.y = 0.26 + dy + (run ? Math.abs(Math.sin(t * 22)) * 0.03 : 0);
  const hy = lying ? 0.18 + headUp * 0.14 : 0.4; const hz = lying ? 0.3 : 0.33; u.head.position.set(0, hy, hz);
  for (const s of [-1, 1]) { u['ear' + s].position.set(s * 0.075, hy + 0.13, hz); u['eye' + s].position.set(s * 0.05, hy + 0.03, hz + 0.125); }
}
const CAT1 = makeCat(0xf0a04b, 0xc4702a);   // engine bay cat
const CAT2 = makeCat(0x5f6670, 0x2f343a);   // under-car cat
// person
const P = new THREE.Group();
const pb = new THREE.Mesh(new THREE.CapsuleGeometry(0.3, 0.85, 6, 12), mat(0x2b6fd6)); pb.position.y = 1.0; P.add(pb);
const ph = new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 12), mat(0xf1c9a5)); ph.position.y = 1.86; P.add(ph);
const hat = new THREE.Mesh(new THREE.SphereGeometry(0.26, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2), mat(0xd8343a)); hat.position.y = 1.9; P.add(hat);
const armP = new THREE.Group(); armP.position.set(0.32, 1.4, 0); P.add(armP);
const arm = new THREE.Mesh(new THREE.CapsuleGeometry(0.09, 0.55, 4, 8), mat(0x2b6fd6)); arm.position.y = -0.33; armP.add(arm);
P.traverse(o => { if (o.isMesh) o.castShadow = true; }); scene.add(P);
// rings (sound)
const rings = [0, 1, 2].map(() => { const r = new THREE.Mesh(new THREE.TorusGeometry(0.5, 0.05, 8, 40), new THREE.MeshBasicMaterial({ color: 0xffe14a, transparent: true, depthWrite: false })); scene.add(r); return r; });
// falling snow
const NS = 500, sp = new Float32Array(NS * 3); const sgeo = new THREE.BufferGeometry(); sgeo.setAttribute('position', new THREE.BufferAttribute(sp, 3));
const snow = new THREE.Points(sgeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.09, transparent: true, opacity: 0.9 })); scene.add(snow);

const ease = p => p < 0 ? 0 : p > 1 ? 1 : 1 - Math.pow(1 - p, 3);
const eio = p => { p = Math.max(0, Math.min(1, p)); return p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; };
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const rnd = n => { const x = Math.sin(n * 12.9898) * 43758.5453; return x - Math.floor(x); };
const $ = id => document.getElementById(id);
const proj = (x, y, z) => { const v = V(x, y, z).project(cam); return [(v.x + 1) / 2 * W, (1 - v.y) / 2 * H]; };
const setText = (el, html, t0, t, pop = true) => { if (html == null) { el.style.opacity = 0; el.dataset.h = ''; return; } if (el.dataset.h !== html) { el.innerHTML = html; el.dataset.h = html; } const u = t - t0; el.style.opacity = clamp(u / 0.08); el.style.transform = pop ? `scale(${1 + 0.2 * (1 - ease(u / 0.18))})` : ''; };
const tag = (id, on, x, y, z, t0 = -9, t = 0) => { const el = $(id); el.style.display = on ? 'block' : 'none'; if (!on) return; let [px, py] = proj(x, y, z); px = clamp(px, 170, 910); py = clamp(py, 700, 1250); el.style.left = px + 'px'; el.style.top = py + 'px'; const s = 1 + 0.3 * (1 - ease((t - t0) / 0.2)); el.style.transform = `translate(-50%,-100%) scale(${s})`; };
function seg(t) { let k = 0; for (let i = 0; i < T.length; i++) if (t >= T[i]) k = i; return k; }
function path(pts, u) { u = clamp(u); const n = pts.length - 1; const f = u * n; const i = Math.min(n - 1, Math.floor(f)); const w = f - i; return [lerp(pts[i][0], pts[i + 1][0], w), lerp(pts[i][1], pts[i + 1][1], w)]; }

const DOOR = [AW / 2 + 0.55, 0.05];
window.seek = async t => {

  hemi.intensity = lerp(1.8, 0.55, nt); sun.intensity = lerp(1.7, 0.15, nt);
  wins.forEach((w, i) => w.material.color.setHex(nt > 0.5 && rnd(i + 3) > 0.45 ? 0xffd27a : 0x5b6b7d));
  // car (stomp bob)

  if (t >= S.slamAt && t < S.slamAt + 0.25) bob = Math.sin((t - S.slamAt) * 60) * 0.03 * (1 - (t - S.slamAt) / 0.25);
  CAR.position.set(0, bob, 0);
  const xr = k <= 1 ? 0.28 : (k === 3 || k === 4) ? 0.42 : k === 5 ? (t < S.cat2At + 1.8 ? 0.4 : 1) : 1;
  carAlpha(xr);
  glow.material.opacity = k <= 1 ? 0.22 + 0.06 * Math.sin(t * 4) : 0;
  // CAT1: lying in bay -> head up on knock -> drops & runs at catOut
  { const c = CAT1; const a = t - S.catOutAt;
    if (a < 0) { c.position.set(BAY[0], BAY[1] - 0.06 + bob, BAY[2]); c.rotation.y = Math.PI * 0.85; c.visible = true;
      const hu = t >= S.knockAt ? ease((t - S.knockAt) / 0.3) : 0; catPose(c, true, hu, false, t); }
    else if (a < 0.35) { const u = eio(a / 0.35); c.position.set(BAY[0], lerp(BAY[1] - 0.06, 0, u), BAY[2] + u * 0.2); c.rotation.y = 0; catPose(c, false, 0, false, t); }
    else { const u = clamp((a - 0.35) / 1.6); const pts = [[0, BAY[2] + 0.2], [-0.3, FZ + 1.4], [-2.2, FZ + 3.4], [-7, FZ + 6]]; const [x, z] = path(pts, u); const [x2, z2] = path(pts, u + 0.02);
      c.position.set(x, 0, z); c.rotation.y = Math.atan2(x2 - x, z2 - z); catPose(c, false, 0, u < 1, t); c.visible = u < 1; } }
  // CAT2: lying under car -> walks out at cat2At
  { const c = CAT2; const a = t - S.cat2At;

      c.position.set(x, 0, z); c.rotation.y = Math.atan2(x2 - x, z2 - z); catPose(c, false, 0, u < 1, t); c.visible = u < 1; } }

  if (k === 3) { const u = eio((t - T[3]) / 1.1); const x = lerp(3.5, 0.75, u), z = lerp(FZ + 3.5, FZ + 0.75, u); P.position.set(x, u < 1 ? Math.abs(Math.sin(t * 9)) * 0.08 : 0, z); P.rotation.y = Math.PI + lerp(0.6, 0, u);
