<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>

*{margin:0;padding:0;box-sizing:border-box}

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const S = window.SPEC, NO = S.narrOffset;
const W = 1080, H = 1920;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.insertBefore(renderer.domElement, document.body.firstChild);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9cc3e6); scene.fog = new THREE.Fog(0x9cc3e6, 70, 170);
const cam = new THREE.PerspectiveCamera(42, W / H, 0.1, 500);

const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(-25, 45, 10); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40 }); scene.add(sun); scene.add(sun.target);
const mat = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.95, ...o });
const plane = (w, h, c, x, z, y = 0, o) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat(c, o)); m.rotation.x = -Math.PI / 2; m.position.set(x, y, z); m.receiveShadow = true; scene.add(m); return m; };
// highway along z (cars drive toward -z). lanes x=-3.6,0,3.6 ; shoulder 5.4..8.6 ; guardrail 9.0
const L = 900, Z0 = -300;
plane(400, L, 0x7a9c5c, 0, Z0);
plane(10.8, L, 0x3b3f45, 0, Z0, 0.01);
plane(3.2, L, 0x4a4e55, 7.0, Z0, 0.011);
plane(1.2, L, 0x4a4e55, -6.0, Z0, 0.011);
const line = (w, h, c, x, z) => plane(w, h, c, x, z, 0.03);
line(0.2, L, 0xffffff, 5.4, Z0); line(0.2, L, 0xf2c200, -5.4, Z0);
for (let z = 60; z > -760; z -= 9) { line(0.16, 4, 0xffffff, -1.8, z); line(0.16, 4, 0xffffff, 1.8, z); }
// guardrail right + median barrier left
const rail = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.35, L), mat(0xd6dadf, { metalness: 0.4, roughness: 0.5 })); rail.position.set(9.0, 0.75, Z0); rail.castShadow = true; scene.add(rail);
const postG = new THREE.BoxGeometry(0.15, 0.8, 0.15), postM = mat(0x9aa1a8);
for (let z = 60; z > -760; z -= 2.5) { const p = new THREE.Mesh(postG, postM); p.position.set(9.1, 0.4, z); scene.add(p); }
const med = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.9, L), mat(0xc9c5bd)); med.position.set(-6.2, 0.45, Z0); med.castShadow = true; scene.add(med);
// trees
const trunkG = new THREE.CylinderGeometry(0.25, 0.3, 2), leafG = new THREE.ConeGeometry(1.8, 4.5, 7);
for (let i = 0; i < 140; i++) { const z = 60 - i * 6.2 + (i % 3); const x = (i % 2 ? 1 : -1) * (14 + (i * 37 % 9)); const tr = new THREE.Mesh(trunkG, mat(0x6b4a2e)); tr.position.set(x, 1, z); const lf = new THREE.Mesh(leafG, mat(0x3f7a3a)); lf.position.set(x, 4, z); lf.castShadow = true; scene.add(tr, lf); }
// models
const loader = new GLTFLoader();
const load = f => new Promise(r => loader.load('glb/' + f, g => r(g.scene)));
const names = ['sedan.glb', 'suv.glb', 'sedan.glb', 'taxi.glb', 'van.glb', 'hatchback-sports.glb', 'truck-flat.glb'];
const M = await Promise.all(names.map(load));
const [A, B, A2, C1, C2, C3, TOW] = M;
for (const c of M) { c.scale.setScalar(1.9); c.traverse(o => { if (o.isMesh) o.castShadow = true; }); scene.add(c); }
const box = new THREE.Box3().setFromObject(A); const AL = box.max.z - box.min.z, AW = box.max.x - box.min.x, AH = box.max.y - box.min.y;
const bb = new THREE.Box3().setFromObject(B); const BL = bb.max.z - bb.min.z;
const debris = await Promise.all(['debris-door.glb', 'debris-bumper.glb', 'debris-plate-a.glb', 'debris-spoiler-a.glb', 'debris-tire.glb'].map(load));
debris.forEach(d => { d.scale.setScalar(1.9); d.visible = false; scene.add(d); });
// hazard lights (children so they follow the car). car forward = +z local (yaw PI faces -z)
const hz = car => { const g = []; for (const [sx, sz] of [[1, 1], [-1, 1], [1, -1], [-1, -1]]) { const s = new THREE.Mesh(new THREE.SphereGeometry(0.06, 10, 8), new THREE.MeshBasicMaterial({ color: 0xffa21a })); s.position.set(sx * AW / 1.9 * 0.42, AH / 1.9 * 0.38, sz * AL / 1.9 * 0.49); car.add(s); g.push(s); } return g; };
const hzA = hz(A), hzA2 = hz(A2);
// trunk lid on A2 (rear = local -z at yaw PI -> world +z)
const lidPivot = new THREE.Group(); lidPivot.position.set(0, AH / 1.9 * 0.66, -AL / 1.9 * 0.27); A2.add(lidPivot);
const lid = new THREE.Mesh(new THREE.BoxGeometry(AW / 1.9 * 0.8, 0.05, AL / 1.9 * 0.16), mat(0xc8452c, { roughness: 0.5 })); lid.position.set(0, 0.03, -AL / 1.9 * 0.08); lidPivot.add(lid); lid.castShadow = true;
// person (simple figure, how-to scene only)
const P = new THREE.Group();
const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.32, 0.9, 6, 12), mat(0xff7a1a)); body.position.y = 1.05; P.add(body);
const head = new THREE.Mesh(new THREE.SphereGeometry(0.27, 16, 12), mat(0xf1c9a5)); head.position.y = 1.95; P.add(head);
P.traverse(o => { if (o.isMesh) o.castShadow = true; }); scene.add(P);
// zones
const zone = (c) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: 0.45, depthWrite: false })); m.rotation.x = -Math.PI / 2; m.position.y = 0.05; scene.add(m); return m; };
const zRed = zone(0xff2020), zGreen = zone(0x22e06b);
// tow beacon
const tb = new THREE.Box3().setFromObject(TOW); const beacon = new THREE.Mesh(new THREE.SphereGeometry(0.1, 10, 8), new THREE.MeshBasicMaterial({ color: 0xffb000 })); beacon.position.set(0, (tb.max.y - tb.min.y) / 1.9 * 0.97, (tb.max.z - tb.min.z) / 1.9 * 0.25); TOW.add(beacon);

const ease = p => p < 0 ? 0 : p > 1 ? 1 : 1 - Math.pow(1 - p, 3);
const eio = p => { p = Math.max(0, Math.min(1, p)); return p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; };
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const rnd = n => { const x = Math.sin(n * 12.9898) * 43758.5453; return x - Math.floor(x); };
const $ = id => document.getElementById(id);
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const proj = (x, y, z) => { const v = V(x, y, z).project(cam); return [(v.x + 1) / 2 * W, (1 - v.y) / 2 * H]; };
const setText = (el, html, t0, t, pop = true) => { if (html == null) { el.style.opacity = 0; el.dataset.h = ''; return; } if (el.dataset.h !== html) { el.innerHTML = html; el.dataset.h = html; } const u = t - t0; el.style.opacity = clamp(u / 0.08); el.style.transform = pop ? `scale(${1 + 0.22 * (1 - ease(u / 0.18))})` : ''; };
const tag = (id, on, x, y, z, txt) => { const el = $(id); el.style.display = on ? 'block' : 'none'; if (!on) return; if (txt != null) el.textContent = txt; const [px, py] = proj(x, y, z); el.style.left = px + 'px'; el.style.top = py + 'px'; };

// ---- crash scene (z around 0). A stopped in lane 3 (x=3.6), B in lane 3 from behind at 26 m/s
const AX = 3.6, AZ = 0, VB = 26;
const bCrashZ = AZ + AL / 2 + BL / 2 - 0.3;
function crash(tt) {
  if (tt <= 0) return { A: { x: AX, z: AZ, yaw: Math.PI - 0.08 }, B: { x: AX, z: bCrashZ - tt * VB, yaw: Math.PI } };
  const e = 1 - Math.exp(-tt * 2.6), f = 1 - Math.exp(-tt * 3.5);
  return { A: { x: AX + 3.0 * e, z: AZ - 9 * e, yaw: Math.PI - 0.08 - 1.1 * e }, B: { x: AX + 0.6 * f, z: bCrashZ - 5.5 * f, yaw: Math.PI + 0.35 * f } };
}
// ---- how-to scene (far ahead, z around Z2). A2 stopped on shoulder
const Z2 = -260, A2X = 7.0;
const put = (o, s, y = 0) => { o.position.set(s.x, y, s.z); o.rotation.y = s.yaw; };
const T = S.t;   // segment start times (video)
function seg(t) { let k = 0; for (let i = 0; i < T.length; i++) if (t >= T[i]) k = i; return k; }

window.seek = async t => {
  const k = seg(t), u0 = t - T[k];
  const blink = Math.floor(t * 2.4) % 2 === 0;
  for (const s of [...hzA, ...hzA2]) s.material.color.setHex(blink ? 0xffa21a : 0x5a3a10);
  // ---- crash-scene state
  let tt = 2.0, crashScene = k <= 3;
  if (k === 0) tt = t - S.crashAt;
  else if (k === 1) { const tc = S.replayCrash; tt = t < tc ? -2.2 + 2.2 * (t - T[1]) / (tc - T[1]) : (t - tc) * 0.7; }
  else if (k === 2) tt = (t - S.chaseCrash);
  else if (k === 3) tt = 2.5;
  const st = crash(tt); put(A, st.A); put(B, st.B);
  A.visible = B.visible = crashScene;
  debris.forEach((d, i) => { if (!crashScene || tt <= 0) { d.visible = false; return; } d.visible = true; const ang = -Math.PI / 2 + (rnd(i + 1) - .5) * 2.6, sp = 4 + rnd(i + 7) * 7; const e = 1 - Math.exp(-tt * 2.6);
    d.position.set(AX + Math.cos(ang) * sp * e * 0.6, Math.max(0, 2.6 * Math.sin(Math.min(tt, 0.7) / 0.7 * Math.PI) * (0.5 + rnd(i))), AZ + AL / 2 + Math.sin(ang) * sp * e); d.rotation.set(tt * 6 * rnd(i + 3), tt * 5, tt * 4 * rnd(i + 5)); });
  // ---- how-to scene
  const how = k >= 4;
  A2.visible = how; put(A2, { x: A2X, z: Z2, yaw: Math.PI - 0.04 });
  lidPivot.rotation.x = 1.15 * eio((t - T[6]) / 0.7); lid.visible = t >= T[6];   // opens at 트
  // traffic in lanes passing A2
  const traf = [[C1, -3.6, 24, 0], [C2, 0, 21, 37], [C3, 3.6, 27, 71]];
  for (const [c, x, v, ph] of traf) { c.visible = how; const z = Z2 + 60 - ((t * v + ph) % 140); put(c, { x, z, yaw: Math.PI }); }
  // tow truck arrives on shoulder at the 1588 segment
  TOW.visible = how && t >= T[9] - 0.2; const tw = eio((t - T[9]) / 3.2); put(TOW, { x: A2X, z: lerp(Z2 + 70, Z2 + AL + 4.5, tw), yaw: Math.PI });
  beacon.material.color.setHex(Math.floor(t * 4) % 2 ? 0xffb000 : 0x553300);
  // person: appears at 밖, walks from car's right side over the guardrail and back upstream
  P.visible = how && t >= T[7];
  { const w = clamp((t - T[7]) / 2.4); let px, pz;
    if (w < 0.45) { const a = w / 0.45; px = lerp(A2X + 1.4, 9.0, a); pz = lerp(Z2 - 0.5, Z2 + 2.5, a); }
    else { const a = (w - 0.45) / 0.55; px = lerp(9.0, 11.6, ease(a)); pz = lerp(Z2 + 2.5, Z2 + 8, ease(a)); }
    const walking = w > 0 && w < 1; P.position.set(px, walking ? Math.abs(Math.sin(t * 9)) * 0.12 : 0, pz); P.rotation.y = Math.atan2(px - (w < .45 ? A2X : 9), pz - Z2) ; }
  // zones
  zRed.visible = (k === 1) || (k === 7 && t >= S.redAt);
  zGreen.visible = how && (k >= 7);
  if (k === 1) { zRed.position.set(AX + AW / 2 + 1.3, 0.05, AZ); zRed.scale.set(2.2, AL + 1, 1); }
  else { zRed.position.set(A2X, 0.05, Z2); zRed.scale.set(AW + 3.2, AL + 3, 1); }
  zRed.material.opacity = 0.32 + 0.18 * Math.sin(t * 9);
  zGreen.position.set(11.9, 0.05, Z2 + 4); zGreen.scale.set(4.6, 16, 1);
  // ---- camera
  let cp, look, sh = 0;
  if (k === 0) { const z = ease((t - S.crashAt) / 0.7); cp = V(-6 + 3 * z, 15 - 5 * z, 30 - 12 * z); look = V(AX - 0.5, 0, AZ - 1 - 2 * z); if (t > S.crashAt && t < S.crashAt + 0.5) sh = (1 - (t - S.crashAt) / 0.5) * 0.7; }
  else if (k === 1) { cp = V(-7, 31, 20); look = V(AX + 0.5, 0, AZ + 3); }
  else if (k === 2) { const bz = Math.max(st.B.z, bCrashZ - 2); cp = V(AX - 2.2, 5.2, bz + 13); look = V(AX + 0.3, 0.6, bz - 22); if (tt > 0 && tt < 0.5) sh = (1 - tt / 0.5) * 0.5; }
  else if (k === 3) { const a = -0.9 + 0.5 * (u0 / (T[4] - T[3])); const cx = AX + 2, cz = AZ - 4; cp = V(cx + 15 * Math.sin(a), 9, cz + 15 * Math.cos(a)); look = V(cx, 0.5, cz); }
  else if (k === 4) { cp = V(-6, 20, Z2 + 34); look = V(4, 0, Z2 - 2); }
  else if (k === 5) { const z = ease(u0 / 1.5); cp = V(lerp(1, 3, z), lerp(7, 5.5, z), Z2 + lerp(18, 13, z)); look = V(A2X - 0.5, 0.6, Z2 - 1); }
  else if (k === 6) { const z = ease(u0 / 1.2); cp = V(lerp(3, 4.5, z), lerp(5.5, 4.2, z), Z2 + lerp(13, 9.5, z)); look = V(A2X, 1.0, Z2 + 1.2); }
  else if (k === 7 || k === 8) { const z = ease((t - T[7]) / 1.4); cp = V(lerp(4.5, 2, z), lerp(4.2, 23, z), Z2 + lerp(9.5, 27, z)); look = V(lerp(A2X, 9.2, z), 0, Z2 + lerp(1.2, 3, z)); }
  else if (k === 9) { const z = ease(u0 / 2); cp = V(lerp(2, -1, z), lerp(23, 11, z), Z2 + lerp(27, 30, z)); look = V(6.5, 0, Z2 + 4); }
  else { const z = ease(u0 / 3); cp = V(lerp(-1, -3, z), lerp(11, 26, z), Z2 + lerp(30, 32, z)); look = V(lerp(6.5, 8.5, z), 0, Z2 + 2); }
  cam.position.copy(cp).add(V((rnd(Math.floor(t * 30)) - .5) * sh, (rnd(Math.floor(t * 30) + 9) - .5) * sh, 0)); cam.lookAt(look);
  sun.position.set(cam.position.x - 25, 45, look.z + 10); sun.target.position.set(look.x, 0, look.z);
  renderer.render(scene, cam);
  // ---- overlays
  const fl = (tc) => (t > tc && t < tc + 0.12) ? 0.85 * (1 - (t - tc) / 0.12) : 0;
  $('flash').style.opacity = Math.max(fl(S.crashAt), k === 1 ? fl(S.replayCrash) * 0.6 : 0, k === 2 ? fl(S.chaseCrash) : 0);
  const dim = k === 4 ? 0.5 * ease(u0 / 0.3) : k === 8 ? 0.45 * ease(u0 / 0.3) : k === 3 ? 0.3 * ease((t - S.numAt) / 0.3) : 0;
  $('dim').style.opacity = dim;
  const X = S.text;
  const topHtml = [X.hook, X.hook, X.chase, X.after, X.intro, null, null, null, null, X.tow, X.end][k];
  const topT0 = k === 1 ? T[0] + 0.15 : k === 0 ? 0.12 : T[k];
  setText($('top'), t < 0.12 ? null : topHtml, topT0, t);
  // mid
  let mid = null, m0 = 0;
  if (k === 3 && t >= S.numAt) { mid = X.num; m0 = S.numAt; }
  if (k === 9) { mid = X.towNum; m0 = T[9] + 0.3; }
  if (k === 10 && t >= S.endTilesAt) { mid = null; }
  setText($('mid'), mid, m0, t);
  setText($('sub'), k === 3 && t >= S.numAt + 0.5 ? X.numSub : k === 9 && t >= T[9] + 1.2 ? X.towSub : null, k === 3 ? S.numAt + 0.5 : T[9] + 1.2, t, false);
  // intro grid (k=4)
  const gs = $('grid').children; for (let i = 0; i < 4; i++) { const a = t - (S.gridAt + i * 0.18); const on = k === 4 && a > 0; gs[i].style.opacity = on ? clamp(a / 0.08) : 0; gs[i].style.transform = on ? `scale(${1 + 0.35 * (1 - ease(a / 0.2))})` : ''; }
  // tile bar (k=5..8, and final summary)
  const barOn = (k >= 5 && k <= 8) || (k === 10 && t >= S.endTilesAt);
  $('bar').style.opacity = barOn ? 1 : 0; $('bar').style.top = k === 10 ? '760px' : '250px';
  const bs = $('bar').children; for (let i = 0; i < 4; i++) { const cur = k - 5; bs[i].className = k === 10 ? 'on' : i === cur ? 'on' : i < cur ? 'done' : ''; }
  const labs = [X.l1, X.l2, X.l3, X.l4]; setText($('lab'), k >= 5 && k <= 8 ? (k === 7 && t >= S.redAt ? X.l3b : labs[k - 5]) : null, k === 7 && t >= S.redAt ? S.redAt : T[k], t);
  // phone
  { const a = k === 8 ? t - T[8] - 0.2 : -1; $('phone').style.opacity = a > 0 ? clamp(a / 0.15) : 0; $('phone').style.transform = a > 0 ? `scale(${1 + 0.15 * (1 - ease(a / 0.25))})` : ''; }
