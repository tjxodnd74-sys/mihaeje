#mid{top:700px;font-size:124px;line-height:1.08}

#cap{top:1330px;font-size:60px;font-weight:800;-webkit-text-stroke:11px #000;white-space:nowrap}

#lab{top:440px;font-size:88px}

const $ = id => document.getElementById(id);
