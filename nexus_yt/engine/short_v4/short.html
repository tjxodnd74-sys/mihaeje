<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
@font-face{font-family:"P";font-weight:500;src:url("fonts/Pretendard-Medium.otf");}
@font-face{font-family:"P";font-weight:600;src:url("fonts/Pretendard-SemiBold.otf");}
@font-face{font-family:"P";font-weight:700;src:url("fonts/Pretendard-Bold.otf");}
@font-face{font-family:"P";font-weight:800;src:url("fonts/Pretendard-ExtraBold.otf");}
@font-face{font-family:"P";font-weight:900;src:url("fonts/Pretendard-Black.otf");}
:root{--ink:#1F1F1D;--mut:#7A7975;--o:#E2622F;--r:#E5484D;--g:#2FA35A}
html,body{margin:0;background:#F3F2EF}
#st{position:relative;width:1080px;height:1920px;overflow:hidden;background:#F3F2EF;font-family:"P",sans-serif;color:var(--ink)}
#grid{position:absolute;inset:-90px;background-image:linear-gradient(to right,rgba(31,31,29,.05) 1px,transparent 1px),linear-gradient(to bottom,rgba(31,31,29,.05) 1px,transparent 1px);background-size:90px 90px}
#glow{position:absolute;left:-200px;top:420px;width:1480px;height:1100px;background:radial-gradient(closest-side,rgba(226,98,47,.16),rgba(226,98,47,0));}
#cam{position:absolute;inset:0;transform-origin:50% 48%}
.a{position:absolute;left:0;top:0;opacity:0;will-change:transform,opacity}
#title{position:absolute;left:0;width:1080px;top:150px;text-align:center;font-weight:900;font-size:86px;letter-spacing:-.04em;line-height:1.12}
#title .o{color:var(--o)}
#bar{position:absolute;left:0;top:0;height:12px;background:var(--o);width:0}
#cap{position:absolute;left:0;width:1080px;top:1420px;display:flex;justify-content:center}
#capi{background:#1F1F1D;color:#fff;font-weight:900;font-size:68px;letter-spacing:-.03em;padding:18px 40px 26px;border-radius:26px;box-shadow:0 24px 50px -20px rgba(0,0,0,.45);white-space:nowrap;opacity:0}
#capi b{color:#FFB38F;font-weight:900}
/* components */
.card{background:#fff;border:1px solid rgba(31,31,29,.09);border-radius:34px;box-shadow:0 2px 0 rgba(255,255,255,.8) inset,0 40px 80px -30px rgba(31,31,29,.28)}
.chat{width:900px;overflow:hidden}
.chat .hd{height:110px;display:flex;align-items:center;gap:22px;padding:0 34px;border-bottom:1px solid #EFEDE8}
.chat .hd .lg{width:66px;height:66px;border-radius:18px;display:flex;align-items:center;justify-content:center}
.chat .hd .lg svg{width:40px;height:40px}
.chat .hd b{font-weight:800;font-size:40px}.chat .hd span{font-weight:600;font-size:26px;color:var(--mut);margin-left:auto}
.chat .bd{padding:34px 34px 10px;display:flex;flex-direction:column;gap:22px;min-height:300px}
.bub{max-width:640px;font-weight:700;font-size:44px;line-height:1.3;padding:22px 30px 26px;border-radius:30px;opacity:0}
.bub.me{align-self:flex-end;background:var(--o);color:#fff;border-bottom-right-radius:8px}
.bub.bad{align-self:flex-end;background:#E5484D;color:#fff;border-bottom-right-radius:8px}
.bub.ai{align-self:flex-start;background:#F1EFEA;color:var(--ink);border-bottom-left-radius:8px}
.bub.sys{align-self:center;background:#FFF1F0;color:#C9423A;border:2px solid #F3B8B3;font-size:36px;font-weight:800}
.chat .in{margin:16px 34px 34px;height:96px;border-radius:48px;background:#F3F2EF;display:flex;align-items:center;padding:0 36px;font-weight:700;font-size:34px;color:#A3A19B}
.chat .in.lock{background:#FFF1F0;color:#C9423A;border:2px solid #F3B8B3}
.dlg{width:820px;padding:56px 50px 50px;text-align:center}
.dlg .ic{width:130px;height:130px;border-radius:50%;margin:0 auto 30px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:80px}
.dlg h1{margin:0;font-weight:900;font-size:62px;letter-spacing:-.03em}
.dlg p{margin:18px 0 0;font-weight:600;font-size:36px;color:var(--mut)}
.dlg .bt{margin-top:40px;height:100px;border-radius:24px;background:var(--ink);color:#fff;font-weight:800;font-size:38px;display:flex;align-items:center;justify-content:center}
.big{font-weight:900;letter-spacing:-.05em;line-height:1;white-space:nowrap;text-align:center}
.sub{font-weight:800;font-size:56px;color:var(--mut);text-align:center;white-space:nowrap;letter-spacing:-.03em}
.stamp{font-weight:900;font-size:92px;letter-spacing:-.03em;padding:12px 46px 22px;border:10px solid currentColor;border-radius:28px;background:#fff;white-space:nowrap;box-shadow:0 30px 60px -25px rgba(31,31,29,.35)}
.tile{width:220px;height:220px;border-radius:56px;display:flex;align-items:center;justify-content:center;box-shadow:0 30px 60px -24px rgba(31,31,29,.35)}
.tile svg{width:120px;height:120px}.tile img{width:150px}
.pill{font-weight:900;font-size:58px;padding:22px 44px 28px;border-radius:999px;background:#fff;border:1px solid rgba(31,31,29,.1);box-shadow:0 20px 40px -24px rgba(31,31,29,.3);white-space:nowrap}
.tb{width:900px;padding:40px 44px}
.tb .r{display:flex;align-items:center;height:118px;border-bottom:1px dashed #E3E0D9;font-size:40px;opacity:0}
.tb .r b{width:230px;font-weight:900}.tb .r span{flex:1;font-weight:600;color:#55544F}.tb .r i{font-style:normal;font-weight:900;color:var(--o)}
.ln{position:absolute;height:10px;border-radius:5px;background:var(--o);transform-origin:0 50%}
.cta{display:flex;flex-direction:column;align-items:center;gap:40px}
.cta img{width:900px;border-radius:30px;box-shadow:0 40px 80px -30px rgba(31,31,29,.45)}
.cta .go{font-weight:900;font-size:54px;color:#fff;background:var(--o);padding:24px 60px 30px;border-radius:999px;box-shadow:0 24px 50px -20px rgba(226,98,47,.7)}
.code{width:900px;padding:40px 44px;font-size:36px;font-weight:600;line-height:1.55;color:#3A3936}
.code .hide{display:inline-block;background:#E5484D;color:#fff;border-radius:10px;padding:2px 14px 6px;font-weight:800}
.phone{width:380px;height:760px;border-radius:64px;background:#17171B;padding:18px;box-sizing:border-box;box-shadow:0 40px 80px -30px rgba(31,31,29,.5)}
.phone .sc{width:100%;height:100%;border-radius:48px;background:linear-gradient(160deg,#833AB4,#E1306C 55%,#F77737);display:flex;align-items:center;justify-content:center}
.play{width:0;height:0;border-left:90px solid #fff;border-top:55px solid transparent;border-bottom:55px solid transparent;margin-left:20px}
.x{position:absolute;height:22px;border-radius:11px;background:#E5484D;transform-origin:0 50%}
</style></head><body>
<div id="st"><div id="grid"></div><div id="glow"></div><div id="cam"></div>
<div id="title"></div><div id="cap"><div id="capi"></div></div><div id="bar"></div></div>
<script>
const st=document.getElementById('st'),cam=document.getElementById('cam'),capi=document.getElementById('capi');
const C=x=>Math.max(0,Math.min(1,x));const eo=p=>1-Math.pow(1-p,3);
const bk=p=>{const c=1.9;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2)};
let ELS=[],SUBS=[];
window.setup=function(S){
 document.getElementById('title').innerHTML=S.title;window.S=S;
 for(const e of S.els){const d=document.createElement('div');d.className='a';d.innerHTML=e.h;cam.appendChild(d);
  const w=d.offsetWidth,h=d.offsetHeight;e.d=d;e.w=w;e.hh=h;ELS.push(e);
  for(const s of (e.subs||[])){const n=d.querySelector(s.q);if(n)SUBS.push({n,t:s.t,a:s.a||'pop',x:s.x});}}
};
function tf(e,t){
 const p=(t-e.t)/(e.din||0.32);let o=0,sx=1,dx=0,dy=0,r=e.r||0;
 if(p<0){e.d.style.opacity=0;return}
 const a=e.a||'pop',q=C(p);if(e.rot)r=e.rot[0]+(e.rot[1]-e.rot[0])*eo(C((t-e.t-e.rot[2])/e.rot[3]));
 if(a==='pop'){o=C(p*3);sx=0.55+0.45*bk(q)}
 else if(a==='up'){o=C(p*2);dy=(1-eo(q))*90}
 else if(a==='stamp'){o=C(p*4);sx=2.3-1.3*eo(q)}
 else if(a==='left'){o=C(p*2);dx=-(1-eo(q))*700}
 else if(a==='right'){o=C(p*2);dx=(1-eo(q))*700}
 else if(a==='drop'){o=C(p*3);dy=-(1-bk(q))*400}
 else if(a==='fade'){o=q}
 if(e.shake&&t-e.t>(e.shake[0]||0)&&t-e.t<(e.shake[0]||0)+0.45)dx+=Math.sin((t-e.t)*80)*16*(1-(t-e.t-(e.shake[0]||0))/0.45);
 if(e.float)dy+=Math.sin(t*2.4+(e.x||0))*8;
 if(e.o!==undefined&&t>e.o){const k=C((t-e.o)/0.18);o*=1-k;sx*=1-0.08*k}
 const x=(e.x??540)-e.w/2+dx,y=(e.y??900)-e.hh/2+dy;
 e.d.style.opacity=o;e.d.style.transform=`translate(${x}px,${y}px) rotate(${r}deg) scale(${sx})`;
 if(e.type){const n=e.d.querySelector(e.type.q);const k=Math.floor(C((t-e.t-(e.type.d||0.2))/e.type.dur)*e.type.text.length);n.textContent=e.type.text.slice(0,k)+(k<e.type.text.length?'|':'')}
 if(e.grow){for(const g of e.grow){const n=e.d.querySelector(g.q);n.style.transform=`scaleX(${eo(C((t-e.t-g.t)/(g.d||0.3)))})`}}
}
window.seek=function(t){
 const S=window.S;
 for(const e of ELS)tf(e,t);
 for(const s of SUBS){const p=(t-s.t)/0.22;if(p<0){s.n.style.opacity=0;continue}
  const q=C(p);s.n.style.opacity=C(p*3);s.n.style.transform=s.a==='slide'?`translateX(${(1-eo(q))*120}px)`:`scale(${0.6+0.4*bk(q)})`;}
 // camera: per scene slow push + punch
 let sc=S.scenes.filter(s=>s[0]<=t).pop()||[0];const lt=t-sc[0];
 const z=1+0.035*C(lt/4)+0.06*Math.max(0,1-lt/0.22);cam.style.transform=`scale(${z})`;
 // captions
 const c=S.caps.find(c=>c[0]<=t&&t<c[1]);
 if(c){if(capi._k!==c[0]){capi.innerHTML=c[2];capi._k=c[0]}const p=C((t-c[0])/0.12);capi.style.opacity=1;capi.style.transform=`scale(${1.18-0.18*eo(p)})`}else capi.style.opacity=0;
 document.getElementById('bar').style.width=(1080*C(t/S.dur))+'px';
 const tp=C(t/0.35);document.getElementById('title').style.transform=`scale(${1.25-0.25*eo(tp)})`;document.getElementById('title').style.opacity=C(t/0.15);
};
</script></body></html>
