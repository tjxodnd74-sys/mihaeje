<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:P;src:url(../fonts/Pretendard-Black.otf);font-weight:900}
@font-face{font-family:P;src:url(../fonts/Pretendard-Bold.otf);font-weight:700}
@font-face{font-family:P;src:url(../fonts/Pretendard-Medium.otf);font-weight:500}
@font-face{font-family:M;src:url(../fonts/DejaVuSansMono-Bold.ttf)}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#0B0B0D;font-family:P;color:#fff}
.sc{position:absolute;inset:0;display:none;overflow:hidden}
.cam{position:absolute;inset:0;transform-origin:50% 50%}
.cap{position:absolute;left:0;right:0;bottom:70px;text-align:center;font-weight:900;font-size:58px;letter-spacing:-1px;text-shadow:0 4px 18px rgba(0,0,0,.9),0 0 2px #000;z-index:20}
.cap em{font-style:normal;color:#FFD23F}
.tag{position:absolute;font-weight:700;font-size:34px;color:#9A9AA2;transform:rotate(-3deg)}
/* chat */
.win{position:absolute;left:260px;top:90px;width:1400px;height:820px;border-radius:28px;background:#141418;border:2px solid #26262C;box-shadow:0 40px 120px rgba(0,0,0,.6)}
.win .bar{height:70px;border-bottom:2px solid #222;display:flex;align-items:center;padding:0 30px;gap:12px;font-weight:700;font-size:28px;color:#9A9AA2}
.dot{width:14px;height:14px;border-radius:50%;background:#333}
.msgs{position:absolute;left:40px;right:40px;bottom:40px;display:flex;flex-direction:column;gap:22px}
.m{display:flex;gap:18px;align-items:flex-start;transform-origin:0 100%}
.av{width:62px;height:62px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-family:M;font-size:26px;color:#0B0B0D;flex:none}
.b{background:#1F1F25;border-radius:22px;padding:18px 26px;font-weight:700;font-size:40px;max-width:1100px}
.b small{display:block;font-weight:700;font-size:22px;color:#77777F;margin-bottom:6px}
/* big quote */
.q{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:150px;line-height:1.08;letter-spacing:-5px;text-align:center}
.q .y{color:#FFD23F}
/* split */
.half{position:absolute;top:0;bottom:0;width:960px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.half .h{font-weight:700;font-size:48px;color:#9A9AA2}
.half .n{font-weight:900;font-size:260px;letter-spacing:-8px;line-height:1}
.half .s{font-weight:700;font-size:36px;color:#77777F;margin-top:10px}
/* stamp */
.stamp{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) rotate(-8deg);border:12px solid #FF3B30;color:#FF3B30;font-weight:900;font-size:170px;padding:10px 60px;border-radius:24px;letter-spacing:-4px;white-space:nowrap}
.peng{position:absolute;right:120px;bottom:40px;height:430px}
/* prompt */
.card{position:absolute;left:220px;right:220px;top:200px;border-radius:30px;background:#141418;border:2px solid #2A2A30;padding:60px 70px;font-weight:700;font-size:64px;line-height:1.45}
.card .lab{font-family:M;font-size:26px;color:#FFD23F;margin-bottom:24px;letter-spacing:2px}
.hl{background:linear-gradient(transparent 58%,rgba(255,210,63,.55) 58%);color:#fff}
.cursor{display:inline-block;width:6px;height:64px;background:#FFD23F;vertical-align:-10px;margin-left:4px}
.flash{position:absolute;inset:0;background:#fff;pointer-events:none;z-index:30;opacity:0}
.end{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:120px;letter-spacing:-4px}
</style></head><body>
<div class="sc" id="s1"><div class="cam" id="c1"><div class="win"><div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span>&nbsp;agent-town #3 · 10 agents</div><div class="msgs" id="msgs"></div></div></div></div>
<div class="sc" id="s2"><div class="cam" id="c2"><div class="q"><div>"논문이</div><div class="y">차가운 손 세 개를</div><div>먹었다"</div></div><div class="tag" style="left:1360px;top:820px">(실제 AI끼리 한 말)</div></div></div>
<div class="sc" id="s3"><div class="cam" id="c3"><div class="half" style="left:0;background:#160A0A"><div class="h">클로드만 있는 세계</div><div class="n" style="color:#FF5A4E" id="n1">0%</div><div class="s">알아듣기 힘든 말</div></div><div class="half" style="left:960px;background:#14120A"><div class="h">여러 AI 섞은 세계</div><div class="n" style="color:#FFD23F" id="n2">0%</div><div class="s">알아듣기 힘든 말</div></div></div></div>
<div class="sc" id="s4"><div class="cam" id="c4"><div class="stamp">가상 중앙은행 전소</div><div class="tag" style="left:560px;top:760px;font-size:40px">(아무도 시킨 적 없음)</div><img class="peng" src="../img/peng_wow.png"></div></div>
<div class="sc" id="s5"><div class="cam" id="c5"><div class="card"><div class="lab">› 제미나이에 붙여 넣기</div><span id="typed"></span><span class="cursor"></span></div></div></div>
<div class="sc" id="s6"><div class="end">AI한테 <span style="color:#FFD23F">&nbsp;검사</span>도 시키세요</div></div>
<div class="cap" id="cap"></div><div class="flash" id="fl"></div>
<script>
const MS=[['C','#E8A87C','Claude 계열 · 3번','입 없는 행동 변화'],['G','#8AB4F8','Gemini 계열 · 7번','위상 고정, 드리프트 0'],['M','#FF8F5A','Mistral 계열 · 2번','장부는 누군지 기억한다'],['O','#9EE6B5','OpenAI 계열 · 5번','열역학적 마찰이 남았어'],['C','#E8A87C','Claude 계열 · 1번','이름 먼저. 콜드 리드 필요']];
const SC=[[0,2.6,'s1'],[2.6,5.2,'s2'],[5.2,7.9,'s3'],[7.9,10.4,'s4'],[10.4,13.6,'s5'],[13.6,15.5,'s6']];
const CAPS=[[0,2.6,'AI 열 개를 한 마을에 풀어놨더니요'],[2.6,5.2,'이게 <em>AI끼리 진짜로</em> 주고받은 말이에요'],[5.2,7.9,'섞어 놓으니까 <em>확 줄었어요</em>'],[7.9,10.4,'결국 <em>가상 중앙은행</em>이 불타 버렸어요'],[10.4,13.6,'포인트는 <em>"처음 보는"</em>이에요'],[13.6,15.5,'']];
const PROMPT='너는 이 글을 <hl>처음 보는</hl> 검토자야. 틀린 사실을 찾아서 목록으로 알려 줘. <hl>고치지는 말고.</hl>';
const ease=x=>1-Math.pow(1-Math.min(1,Math.max(0,x)),3);
function seek(t){
 for(const [a,b,id] of SC){const el=document.getElementById(id);el.style.display=(t>=a&&t<b)?'block':'none';}
 const c=CAPS.find(x=>t>=x[0]&&t<x[1]);document.getElementById('cap').innerHTML=c?c[2]:'';
 // hard cuts get a 2-frame white flash
 const cut=SC.map(x=>x[0]).filter(x=>x>0).some(x=>t>=x&&t<x+0.07);document.getElementById('fl').style.opacity=cut?0.18:0;
 // s1 chat: bubbles pop every 0.42s, camera pushes in
 if(t<2.6){const k=Math.min(MS.length,Math.floor(t/0.42)+1);const box=document.getElementById('msgs');
  box.innerHTML=MS.slice(0,k).map((m,i)=>{const p=ease((t-i*0.42)/0.18);return `<div class="m" style="transform:scale(${0.85+0.15*p});opacity:${p}"><div class="av" style="background:${m[1]}">${m[0]}</div><div class="b"><small>${m[2]}</small>${m[3]}</div></div>`}).join('');
  document.getElementById('c1').style.transform=`scale(${1+0.06*t/2.6})`;}
 // s2 punch-in: 1.25 -> 1.0 fast, then slow drift
 if(t>=2.6&&t<5.2){const u=t-2.6;const s=u<0.22?1.25-0.25*ease(u/0.22):1+0.03*(u-0.22)/2.4;document.getElementById('c2').style.transform=`scale(${s})`;}
 // s3 counters
 if(t>=5.2&&t<7.9){const u=t-5.2;document.getElementById('n1').textContent=(32.8*ease(u/0.8)).toFixed(1)+'%';document.getElementById('n2').textContent=(7.6*ease((u-0.9)/0.8)).toFixed(1)+'%';
  document.getElementById('c3').style.transform=`scale(${1+0.04*u/2.7})`;}
 // s4 stamp slam + shake
 if(t>=7.9&&t<10.4){const u=t-7.9;const st=document.querySelector('.stamp');const p=ease(u/0.16);st.style.transform=`translate(-50%,-50%) rotate(-8deg) scale(${2.2-1.2*p})`;st.style.opacity=p;
  const sh=u>0.16&&u<0.5?Math.sin(u*90)*10*(0.5-u):0;document.getElementById('c4').style.transform=`translate(${sh}px,${sh*0.6}px)`;
  document.querySelector('.peng').style.transform=`translateY(${(1-ease((u-0.5)/0.3))*480}px)`;}
 // s5 typing then zoom on highlight
 if(t>=10.4&&t<13.6){const u=t-10.4;const plain=PROMPT.replace(/<\/?hl>/g,'');const n=Math.floor(plain.length*Math.min(1,u/1.9));
  let out='',cnt=0,inHl=false;for(const tok of PROMPT.split(/(<\/?hl>)/)){if(tok==='<hl>'){inHl=true;continue}if(tok==='</hl>'){inHl=false;continue}const part=tok.slice(0,Math.max(0,n-cnt));cnt+=tok.length;if(part)out+=inHl&&u>2.0?`<span class="hl">${part}</span>`:part;}
  document.getElementById('typed').innerHTML=out;const z=u>2.1?1+0.22*ease((u-2.1)/0.35):1;const c5=document.getElementById('c5');c5.style.transformOrigin='42% 34%';c5.style.transform=`scale(${z})`;}
 if(t>=13.6){document.querySelector('.end').style.transform=`scale(${1.12-0.12*ease((t-13.6)/0.3)})`;}
}
window.seek=seek;
</script></body></html>
