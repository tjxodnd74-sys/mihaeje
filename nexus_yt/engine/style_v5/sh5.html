<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:P;src:url(../fonts/Pretendard-Black.otf);font-weight:900}
@font-face{font-family:P;src:url(../fonts/Pretendard-Bold.otf);font-weight:700}
@font-face{font-family:M;src:url(../fonts/DejaVuSansMono-Bold.ttf)}
:root{--y:#FFD23F;--r:#FF5A4E}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#0B0B0D;font-family:P;color:#fff}
.shot{position:absolute;inset:0;overflow:hidden}.cam{position:absolute;inset:0;transform-origin:50% 55%}
.y{color:var(--y)}.r{color:var(--r)}.mut{color:#8E8E96}
.cap{position:absolute;left:60px;right:60px;top:300px;text-align:center;font-weight:900;font-size:76px;line-height:1.2;letter-spacing:-2px;text-shadow:0 6px 24px rgba(0,0,0,.95);z-index:20}
.cap em{font-style:normal;color:var(--y)}
.flash{position:absolute;inset:0;background:#fff;z-index:30;opacity:0}
.big{position:absolute;left:40px;right:40px;top:640px;bottom:420px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-weight:900;letter-spacing:-4px;line-height:1.1}
.tag{position:absolute;font-weight:700;font-size:44px;color:#9A9AA2;transform:rotate(-3deg)}
.win{position:absolute;left:50px;right:50px;top:620px;height:900px;border-radius:34px;background:#141418;border:2px solid #26262C;overflow:hidden}
.msgs{position:absolute;left:30px;right:30px;top:30px;bottom:30px;display:flex;flex-direction:column;justify-content:flex-end;gap:22px}
.m{display:flex;gap:18px;align-items:flex-start}
.av{width:70px;height:70px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-family:M;font-size:30px;color:#111;flex:none}
.b{background:#1F1F25;border-radius:24px;padding:18px 26px;font-weight:700;font-size:48px}
.b small{display:block;font-size:26px;color:#77777F;margin-bottom:6px}
.half{position:absolute;left:0;right:0;height:640px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.half .h{font-weight:700;font-size:54px;color:#9A9AA2}.half .n{font-weight:900;font-size:230px;letter-spacing:-8px;line-height:1}
.stamp{position:absolute;left:50%;top:1050px;border:12px solid var(--r);color:var(--r);font-weight:900;font-size:120px;padding:10px 46px;border-radius:24px;white-space:nowrap}
.peng{position:absolute;right:40px;bottom:200px;height:460px}
</style></head><body><div id="stage"></div><div class="cap" id="cap"></div><div class="flash" id="fl"></div>
<script src="sh_data.js"></script>
<script>
const ease=x=>1-Math.pow(1-Math.min(1,Math.max(0,x)),3);const V=window.SV,SH=window.SSH;const stage=document.getElementById('stage');let cur=-1,el;
SH.forEach((s,i)=>{s.t0=Math.max(0,V.lines[s.at][0]-0.1);});SH.forEach((s,i)=>{s.t1=i+1<SH.length?SH[i+1].t0:V.dur;});
const R={};
R.chat=(s,e)=>{e.innerHTML=`<div class="cam"><div class="win"><div class="msgs"></div></div></div>`;const box=e.querySelector('.msgs');return u=>{const k=Math.min(s.msgs.length,Math.floor(u/0.4)+1);
 box.innerHTML=s.msgs.slice(Math.max(0,k-6),k).map((m,i0)=>{const i=i0+Math.max(0,k-6);const p=ease((u-i*0.4)/0.18);return `<div class="m" style="opacity:${p};transform:scale(${0.85+0.15*p})"><div class="av" style="background:${m[1]}">${m[0]}</div><div class="b"><small>${m[2]}</small>${m[3]}</div></div>`}).join('');e.firstChild.style.transform=`scale(${1+0.05*Math.min(u,3)/3})`;}};
R.big=(s,e)=>{e.innerHTML=`<div class="cam"><div class="big" style="font-size:${s.size||140}px">${s.html}</div>${s.tag?`<div class="tag" style="right:60px;top:1500px">${s.tag}</div>`:''}</div>`;return u=>{const z=u<0.22?1.25-0.25*ease(u/0.22):1+0.03*(u-0.22)/3;e.firstChild.style.transform=`scale(${z})`;}};
R.split=(s,e)=>{e.innerHTML=`<div class="cam"><div class="half" style="top:560px;background:#160A0A"><div class="h">${s.a[0]}</div><div class="n r">0%</div></div><div class="half" style="top:1200px;background:#14120A"><div class="h">${s.b[0]}</div><div class="n y">0%</div></div></div>`;
 const n=e.querySelectorAll('.n');return u=>{n[0].textContent=(s.a[1]*ease(u/0.7)).toFixed(1)+'%';n[1].textContent=(s.b[1]*ease((u-0.8)/0.7)).toFixed(1)+'%';}};
R.stamp=(s,e)=>{e.innerHTML=`<div class="cam"><div class="stamp">${s.text}</div><img class="peng" src="../img/peng_${s.peng||'wow'}.png"></div>`;const st=e.querySelector('.stamp'),pg=e.querySelector('.peng');
 return u=>{const p=ease(u/0.16);st.style.transform=`translate(-50%,-50%) rotate(-7deg) scale(${2.2-1.2*p})`;st.style.opacity=p;const sh=u>0.16&&u<0.5?Math.sin(u*90)*12*(0.5-u):0;e.firstChild.style.transform=`translate(${sh}px,${sh*0.6}px)`;pg.style.transform=`translateY(${(1-ease((u-0.45)/0.3))*600}px)`;}};
R.img=(s,e)=>{e.innerHTML=`<div class="cam"><div style="position:absolute;inset:0;background:url(../ai/${s.img}.png) center/cover" class="im"></div><div style="position:absolute;left:0;right:0;top:0;height:640px;background:linear-gradient(rgba(8,8,10,.9),transparent)"></div>${s.stamp?`<div class="stamp">${s.stamp}</div>`:''}</div>`;const im=e.querySelector('.im'),st=e.querySelector('.stamp');
 return u=>{const d=Math.max(2,s.t1-s.t0);im.style.transform=`scale(${1.05+0.12*Math.min(1,u/d)})`;if(st){const p=ease((u-0.3)/0.16);st.style.opacity=p;st.style.transform=`translate(-50%,-50%) rotate(-7deg) scale(${2.2-1.2*p})`;}}};
R.cta=(s,e)=>{e.innerHTML=`<div class="cam"><div style="position:absolute;left:90px;right:90px;top:760px"><img src="../th_long.png" style="width:100%;border-radius:28px;border:3px solid #FFD23F;box-shadow:0 30px 80px rgba(255,210,63,.25)"></div><div class="big" style="top:1330px;bottom:300px;font-size:90px">${s.html}</div></div>`;return u=>{const p=ease(u/0.3);e.firstChild.style.opacity=p;e.firstChild.style.transform=`translateY(${(1-p)*80}px)`;}};
function seek(t){let i=SH.findIndex(s=>t>=s.t0&&t<s.t1);if(i<0)i=SH.length-1;if(i!==cur){stage.innerHTML='';el=document.createElement('div');el.className='shot';stage.appendChild(el);SH[i].fn=R[SH[i].type](SH[i],el);cur=i;}
 SH[i].fn(t-SH[i].t0,t);const c=V.lines.find(l=>t>=l[0]&&t<l[1]+0.15);document.getElementById('cap').innerHTML=c?c[2]:'';document.getElementById('fl').style.opacity=(i>0&&t-SH[i].t0<0.067)?0.18:0;}
window.seek=seek;window.DUR=V.dur;
</script></body></html>
