<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="즉흥촬영">
<meta name="theme-color" content="#000000">
<title>즉흥연기 촬영기</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#vid{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#111}
#vid.mirror{transform:scaleX(-1)}
/* 필터 화면: 9:16 영역 기준 */
.frame{position:fixed;left:50%;top:50%;width:min(100vw,56.25vh);aspect-ratio:9/16;transform:translate(-50%,-50%);pointer-events:none;container-type:size}
@supports not (aspect-ratio:1){.frame{width:56.25vh}}
.title{position:absolute;top:4.6cqh;left:0;right:0;display:flex;flex-direction:column;align-items:center}
.title span{background:#000;color:#fff;font-weight:700;font-size:3cqh;line-height:1.35;padding:.2em .6em;border-radius:.35em}
.title span+span{margin-top:-.1em}
.rail{position:absolute;top:0;bottom:0;left:27.8%;width:.36cqh;background:#fff;transform:translateX(-50%)}
.track{position:absolute;left:0;right:0;top:0;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.node{position:absolute;left:0;right:0;height:0}
.dot{position:absolute;left:27.8%;top:0;width:4.2cqh;height:4.2cqh;border-radius:50%;background:#8C8C8C;border:.42cqh solid #fff;transform:translate(-50%,-50%);box-sizing:border-box}
.node.on .dot{background:#F7D417}
.lab{position:absolute;right:calc(72.2% + 3cqh);top:0;transform:translateY(-50%);font-weight:700;font-size:2.1cqh;white-space:nowrap;text-shadow:0 .1cqh .4cqh rgba(0,0,0,.6)}
.val{position:absolute;left:calc(27.8% + 3.2cqh);right:2.5cqh;top:0;transform:translateY(-50%);font-weight:700;font-size:2.5cqh;line-height:1.25;text-shadow:0 .1cqh .4cqh rgba(0,0,0,.6);overflow-wrap:anywhere}
.node.used .val::after{content:" ✓";color:#F7D417}
.count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20cqh;text-shadow:0 .4cqh 2cqh rgba(0,0,0,.5)}
.count[hidden]{display:none}
/* 조작부 */
.top{position:fixed;left:0;right:0;top:0;display:flex;gap:6px;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 6px) 8px 6px;z-index:5}
.top select,.top button{font:inherit;font-size:13px;border:0;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;padding:8px 12px;-webkit-appearance:none;appearance:none}
.rectime{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 8px);transform:translateX(-50%);background:#E5484D;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;z-index:5}
.rectime[hidden]{display:none}
.bottom{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-around;padding:10px 10px calc(env(safe-area-inset-bottom,0px) + 14px);z-index:5}
.btn{border:0;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font:inherit;font-weight:700;font-size:14px;min-width:62px;height:50px;padding:0 12px}
.btn:disabled{opacity:.3}
.ok{background:#F7D417;color:#111}
.rec{width:76px;height:76px;min-width:76px;border-radius:50%;border:5px solid #fff;background:#E5484D;padding:0}
.rec.on{background:rgba(255,255,255,.25)}
.rec.on::after{content:"";display:block;width:26px;height:26px;margin:auto;border-radius:6px;background:#E5484D}
.toast{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);background:rgba(0,0,0,.78);padding:14px 18px;border-radius:14px;font-size:15px;text-align:center;z-index:8;max-width:82vw;line-height:1.5}
.toast[hidden]{display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#15171c;border-radius:18px 18px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px);z-index:9;display:flex;flex-direction:column;gap:10px}
.sheet[hidden]{display:none}
.sheet p{margin:0 0 4px;font-size:14px;color:#aab;line-height:1.5}
.sheet button{font:inherit;font-weight:800;font-size:16px;border:0;border-radius:12px;padding:15px;background:#2a2d35;color:#fff}
.sheet .primary{background:#F7D417;color:#111}
</style></head><body>
<video id="vid" playsinline muted autoplay class="mirror"></video>
<div class="frame">
  <div class="title"><span>단어 끼워넣기 즉흥연기</span><span id="sitText">-이별-</span></div>
  <div class="rail"></div>
  <div class="track" id="track"></div>
  <div class="count" id="count" hidden></div>
</div>
<div class="top" id="top">
  <select id="sitSel" aria-label="상황"></select>
  <select id="gapSel" aria-label="속도"><option value="2500">빠르게</option><option value="4000" selected>보통</option><option value="6000">느리게</option><option value="0">직접</option></select>
  <button id="flipBtn" type="button">카메라 전환</button>
</div>
<div class="rectime" id="recTime" hidden>● 0:00</div>
<div class="bottom">
  <button class="btn" id="resetBtn" disabled>다시</button>
  <button class="btn" id="nextBtn" disabled>다음</button>
  <button class="rec" id="recBtn" aria-label="녹화"></button>
  <button class="btn ok" id="usedBtn" disabled>썼다 ✓</button>
  <span style="min-width:62px"></span>
</div>
<div class="toast" id="toast">카메라·마이크 권한을 허용해 주세요</div>
<div class="sheet" id="sheet" hidden>
  <p>녹화 끝! 영상은 필터 없이 원본 화질로 저장돼요. 필터는 기록을 보고 편집할 때 똑같이 입혀요.</p>
  <button class="primary" id="saveBtn">1. 영상 저장하기</button>
  <button id="copyBtn">2. 기록 복사하기 (클로드에게 붙여넣기)</button>
  <button id="closeBtn">닫기</button>
</div>
<script>
const WORDS_KO=["삼겹살","국민연금","공룡","비둘기","연말정산","탕후루","김장","고등어","세탁기","마라탕","헬스장","로또","미역국","펭귄","전기장판","붕어빵","월세","문어","치킨무","노래방","감자탕","지하철 2호선","고구마","청약","주차 딱지","포크레인","해녀","방어회","단톡방","손톱깎이","외계인","빨래 건조대","알로에","전동 킥보드","찜질방 계란","축의금","돼지국밥","이장님","동치미","군고구마","트로트","노가리","고무장갑","양말 한 짝","거북이","산낙지","족발","고추냉이","할머니 집","택배 상자","콧털","대머리 독수리","오징어 게임","면봉","줄넘기","소금빵","도라지","청국장","목욕탕 의자","관광버스"];
const WORDS_IDIOM=["우왕좌왕","동문서답","일석이조","자업자득","금시초문","오리무중","적반하장","작심삼일","천고마비","유비무환","어부지리","호시탐탐","사면초가","대기만성"];
const WORDS_SOUND=["꽥","뿌잉뿌잉","쩝쩝","부릉부릉","꼬끼오","딩동댕","으라차차","얍"];
const WORDS_EN=["It's not you, it's me","Fire in the hole","Long time no see","No pain, no gain","Bless you","Peanut butter","Kangaroo","Hot potato","Tax refund","Shrimp","Oh my god","Plot twist","Game over","See you later, alligator","Big mistake","Avocado","Thank you, next"];
const WORDS_FR=["C'est la vie","Je ne sais quoi","Bonjour","Croissant","Oh là là","Merci beaucoup","Rendez-vous","Bon appétit","Déjà vu","Ça va?","Voilà","Mon amour","Fromage","Baguette","Pamplemousse"];
const WORDS_PROVERB=["가는 말이 고와야 오는 말이 곱다","원숭이도 나무에서 떨어진다","소 잃고 외양간 고친다","등잔 밑이 어둡다","티끌 모아 태산","고래 싸움에 새우 등 터진다","개구리 올챙이 적 생각 못 한다","꿩 먹고 알 먹고","누워서 떡 먹기","세 살 버릇 여든까지 간다","백지장도 맞들면 낫다","하늘이 무너져도 솟아날 구멍이 있다","낮말은 새가 듣고 밤말은 쥐가 듣는다","말 한마디로 천 냥 빚을 갚는다","도토리 키 재기","지렁이도 밟으면 꿈틀한다","우물 안 개구리","빈 수레가 요란하다","바늘 도둑이 소도둑 된다","믿는 도끼에 발등 찍힌다","울며 겨자 먹기","돌다리도 두들겨 보고 건너라"];
/* 한 세트(4칸)에 외국어는 딱 한 개만. 나머지는 한국어 단어·사자성어·의성어, 보너스는 속담 */
function pickFrom(a){return a[Math.floor(Math.random()*a.length)];}
function randomKo(){const x=Math.random();if(x<.7)return pickFrom(WORDS_KO);if(x<.88)return pickFrom(WORDS_IDIOM);return pickFrom(WORDS_SOUND);}
function randomForeign(phrase){const pool=Math.random()<.5?WORDS_EN:WORDS_FR;const f=phrase?pool.filter(w=>/[ ']/.test(w)):pool;return pickFrom(f.length?f:pool);}
function randomWord(){return Math.random()<.25?randomForeign(false):randomKo();}
function randomBonus(){return pickFrom(WORDS_PROVERB);}
function wordSet(){
  const fi=Math.floor(Math.random()*4),out=[];
  for(let i=0;i<3;i++){let w;do{w=i===fi?randomForeign(false):randomKo();}while(out.includes(w));out.push(w);}
  out.push(fi===3?randomForeign(true):randomBonus());return out;
}

const SITS=["이별","고백","프러포즈","소개팅","부모님께 인사","싸우고 화해","전 애인과 재회","결혼식 서약"];
const LABELS=["Word 1","Word 2","Word 3","Bonus"];
const STEP=24,CUR=50;
const $=id=>document.getElementById(id),vid=$("vid");
{const o=document.createElement("option");o.value="__rand";o.textContent="상황: 랜덤";$("sitSel").appendChild(o);
 SITS.forEach(s=>{const p=document.createElement("option");p.value=s;p.textContent="상황: "+s;$("sitSel").appendChild(p);});}
let stream=null,facing="user",rec=null,chunks=[],state=null,timer=null,t0=0,mime="",lastBlob=null,lastName="",lastLog="",tick=null;
function toast(t,ms){const el=$("toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);if(ms)toast.t=setTimeout(()=>el.hidden=true,ms);}
async function openStream(){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({
    video:{facingMode:facing,width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:30,max:30}},
    audio:{echoCancellation:false,noiseSuppression:true,autoGainControl:true}});
  vid.srcObject=stream;vid.classList.toggle("mirror",facing==="user");await vid.play().catch(()=>{});
  $("toast").hidden=true;
}
openStream().catch(e=>toast("카메라를 열 수 없어요. 설정 > 사파리 > 카메라·마이크를 허용해 주세요 ("+e.name+")"));
$("flipBtn").onclick=()=>{if(state)return;facing=facing==="user"?"environment":"user";openStream().catch(e=>toast(e.name,2500));};

function buildTrack(){const tr=$("track");tr.textContent="";tr.style.transform="translateY(0)";
  LABELS.forEach((l,i)=>{const n=document.createElement("div");n.className="node";n.style.top=(CUR+STEP*i)+"cqh";n.dataset.i=i;
    n.innerHTML='<div class="dot"></div><div class="lab"></div><div class="val"></div>';n.querySelector(".lab").textContent=l;tr.appendChild(n);});}
buildTrack();
const nowMs=()=>Math.round(performance.now()-t0);
function newAttempt(){clearTimeout(timer);
  state.cur={start:nowMs(),plan:wordSet(),idx:0,rolling:false,items:[]};state.attempts.push(state.cur);buildTrack();timer=setTimeout(reveal,1200);}
function reveal(){if(!state||!state.cur)return;const a=state.cur;if(a.idx>=LABELS.length||a.rolling)return;clearTimeout(timer);
  const i=a.idx;a.idx++;a.rolling=true;$("track").style.transform="translateY(-"+(STEP*i)+"cqh)";
  const node=$("track").querySelector('[data-i="'+i+'"]'),v=node.querySelector(".val");node.classList.add("on");
  const t=nowMs();let n=0;
  const spin=setInterval(()=>{v.textContent=i===3?randomBonus():randomWord();n++;
    if(n>=8){clearInterval(spin);v.textContent=a.plan[i];if(state&&state.cur===a){a.rolling=false;a.items.push({k:LABELS[i],v:a.plan[i],t});if(a.idx<LABELS.length&&state.gap)timer=setTimeout(reveal,state.gap);}}},80);}
function markUsed(){if(!state||!state.cur)return;const a=state.cur;
  for(const it of a.items){if(!it.usedAt){it.usedAt=nowMs();$("track").querySelector('[data-i="'+LABELS.indexOf(it.k)+'"]').classList.add("used");return;}}}
function pickMime(){const c=["video/mp4;codecs=avc1","video/mp4","video/webm;codecs=vp9,opus","video/webm"];return c.find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||"";}
function startRec(){
  if(!stream){toast("카메라가 아직 안 켜졌어요",2000);return;}
  const sit=$("sitSel").value==="__rand"?SITS[Math.floor(Math.random()*SITS.length)]:$("sitSel").value;
  $("sitText").textContent="-"+sit+"-";
  mime=pickMime();
  try{rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:12000000}:{videoBitsPerSecond:12000000});}catch(e){toast("이 기기에선 녹화가 안 돼요 ("+e.name+")",3000);return;}
  chunks=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};rec.onstop=done;rec.start(1000);t0=performance.now();
  state={sit,gap:+$("gapSel").value,camera:facing,attempts:[],cur:null};
  $("recBtn").classList.add("on");$("top").style.visibility="hidden";$("recTime").hidden=false;
  tick=setInterval(()=>{const s=Math.floor(nowMs()/1000);$("recTime").textContent="● "+Math.floor(s/60)+":"+String(s%60).padStart(2,"0");},500);
  ["resetBtn","nextBtn","usedBtn"].forEach(id=>$(id).disabled=false);
  try{navigator.wakeLock&&navigator.wakeLock.request("screen").catch(()=>{});}catch(e){}
  const c=$("count");let n=3;c.textContent=n;c.hidden=false;
  const cd=setInterval(()=>{n--;if(n>0){c.textContent=n;return;}clearInterval(cd);c.hidden=true;newAttempt();},1000);
}
function stopRec(){if(rec&&rec.state==="recording"){clearTimeout(timer);clearInterval(tick);rec.stop();}}
function stamp(){const d=new Date(),p=n=>String(n).padStart(2,"0");return p(d.getMonth()+1)+p(d.getDate())+"_"+p(d.getHours())+p(d.getMinutes());}
function done(){
  const type=(mime||"video/webm").split(";")[0],ext=type.includes("mp4")?"mp4":"webm";
  lastBlob=new Blob(chunks,{type});lastName="즉흥_"+state.sit+"_"+stamp()+"."+ext;
  lastLog="[즉흥연기 기록] "+lastName+"\n"+JSON.stringify({sit:state.sit,camera:state.camera,attempts:state.attempts.map(a=>({start:a.start,items:a.items}))});
  try{localStorage.setItem("last_log",lastLog);}catch(e){}
  state=null;$("recBtn").classList.remove("on");$("top").style.visibility="visible";$("recTime").hidden=true;
  ["resetBtn","nextBtn","usedBtn"].forEach(id=>$(id).disabled=true);$("sheet").hidden=false;
}
$("saveBtn").onclick=async()=>{
  if(!lastBlob)return;const file=new File([lastBlob],lastName,{type:lastBlob.type});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});toast("저장했으면 이제 2번 기록 복사!",2200);return;}}catch(e){if(e.name==="AbortError")return;}
  const a=document.createElement("a");a.href=URL.createObjectURL(lastBlob);a.download=lastName;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},3000);
};
$("copyBtn").onclick=async()=>{try{await navigator.clipboard.writeText(lastLog);toast("복사했어요. 영상 보낼 때 같이 붙여넣어 주세요",2500);}catch(e){toast("복사가 안 됐어요. 화면을 캡처해서 보내주세요",2500);}};
$("closeBtn").onclick=()=>{$("sheet").hidden=true;};
$("recBtn").onclick=()=>{if(rec&&rec.state==="recording")stopRec();else startRec();};
$("resetBtn").onclick=()=>state&&state.cur&&newAttempt();
$("nextBtn").onclick=reveal;$("usedBtn").onclick=markUsed;
</script>
</body></html>
