<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="즉흥촬영">
<meta name="theme-color" content="#000000">
<title>즉흥연기 촬영기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@700;900&display=swap">
<style>
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#cv{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);height:100vh;height:100dvh;max-width:100vw;aspect-ratio:9/16;object-fit:contain;background:#111}
.top{position:fixed;left:0;right:0;top:0;display:flex;gap:6px;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 8px;z-index:5}
.top select,.top button{font:inherit;font-size:13px;border:0;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;padding:8px 12px;-webkit-appearance:none;appearance:none}
.bottom{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-around;gap:6px;padding:10px 10px calc(env(safe-area-inset-bottom,0px) + 14px);z-index:5}
.btn{border:0;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font:inherit;font-weight:700;font-size:14px;min-width:64px;height:52px;padding:0 12px}
.btn:disabled{opacity:.35}
.rec{width:78px;height:78px;min-width:78px;border-radius:50%;border:5px solid #fff;background:#E5484D;font-size:0}
.rec.on{background:#fff}
.rec.on::after{content:"";display:block;width:26px;height:26px;margin:auto;border-radius:6px;background:#E5484D}
.ok{background:#F7D417;color:#111}
.toast{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);background:rgba(0,0,0,.75);padding:14px 18px;border-radius:14px;font-size:15px;text-align:center;z-index:6;max-width:80vw;line-height:1.5}
.toast[hidden]{display:none}
.save{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 110px);transform:translateX(-50%);z-index:7;background:#F7D417;color:#111;border:0;border-radius:999px;font:inherit;font-weight:900;font-size:17px;padding:14px 26px}
.save[hidden]{display:none}
</style></head><body>
<canvas id="cv" width="1080" height="1920"></canvas>
<div class="top" id="top">
  <select id="sitSel" aria-label="상황"></select>
  <select id="gapSel" aria-label="속도"><option value="2500">빠르게</option><option value="4000" selected>보통</option><option value="6000">느리게</option><option value="0">직접</option></select>
  <button id="flipBtn" type="button">카메라 전환</button>
</div>
<div class="bottom">
  <button class="btn" id="resetBtn" disabled>다시</button>
  <button class="btn" id="nextBtn" disabled>다음</button>
  <button class="rec" id="recBtn" aria-label="녹화"></button>
  <button class="btn ok" id="usedBtn" disabled>썼다 ✓</button>
  <button class="btn" id="spacer" disabled style="visibility:hidden">-</button>
</div>
<div class="toast" id="toast">카메라·마이크 권한을 허용해 주세요</div>
<button class="save" id="saveBtn" hidden>영상 저장하기</button>
<video id="vid" playsinline muted autoplay style="display:none"></video>
<script>
const WORDS_KO=["삼겹살","국민연금","공룡","비둘기","연말정산","탕후루","김장","고등어","세탁기","마라탕","헬스장","로또","미역국","펭귄","전기장판","붕어빵","월세","문어","치킨무","노래방","감자탕","지하철 2호선","고구마","청약","주차 딱지","포크레인","해녀","방어회","단톡방","손톱깎이","외계인","빨래 건조대","알로에","전동 킥보드","찜질방 계란","축의금","돼지국밥","이장님","동치미","군고구마","트로트","노가리","고무장갑","양말 한 짝","거북이","산낙지","족발","고추냉이","할머니 집","택배 상자","콧털","대머리 독수리","오징어 게임","면봉","줄넘기","소금빵","도라지","청국장","목욕탕 의자","관광버스"];
const WORDS_IDIOM=["우왕좌왕","동문서답","일석이조","자업자득","금시초문","오리무중","적반하장","작심삼일","천고마비","유비무환","어부지리","호시탐탐","사면초가","대기만성"];
const WORDS_SOUND=["꽥","뿌잉뿌잉","쩝쩝","부릉부릉","꼬끼오","딩동댕","으라차차","얍"];
const WORDS_EN=["It's not you, it's me","Fire in the hole","Long time no see","No pain, no gain","Bless you","Peanut butter","Kangaroo","Hot potato","Tax refund","Shrimp","Oh my god","Plot twist","Game over","See you later, alligator","Big mistake","Avocado","Thank you, next"];
const WORDS_FR=["C'est la vie","Je ne sais quoi","Bonjour","Croissant","Oh là là","Merci beaucoup","Rendez-vous","Bon appétit","Déjà vu","Ça va?","Voilà","Mon amour","Fromage","Baguette","Pamplemousse"];
const WORDS_PROVERB=["가는 말이 고와야 오는 말이 곱다","원숭이도 나무에서 떨어진다","소 잃고 외양간 고친다","등잔 밑이 어둡다","티끌 모아 태산","고래 싸움에 새우 등 터진다","개구리 올챙이 적 생각 못 한다","꿩 먹고 알 먹고","누워서 떡 먹기","세 살 버릇 여든까지 간다","백지장도 맞들면 낫다","하늘이 무너져도 솟아날 구멍이 있다","낮말은 새가 듣고 밤말은 쥐가 듣는다","말 한마디로 천 냥 빚을 갚는다","도토리 키 재기","지렁이도 밟으면 꿈틀한다","우물 안 개구리","빈 수레가 요란하다","바늘 도둑이 소도둑 된다","믿는 도끼에 발등 찍힌다","울며 겨자 먹기","돌다리도 두들겨 보고 건너라"];
/* 한 세트(4칸)에 외국어는 딱 한 개만. 나머지는 한국어 단어·사자성어·의성어, 보너스는 속담 */
function pickFrom(a){return a[Math.floor(Math.random()*a.length)];}
function randomKo(){const x=Math.random();if(x<.7)return pickFrom(WORDS_KO);if(x<.88)return pickFrom(WORDS_IDIOM);return pickFrom(WORDS_SOUND);}
function randomForeign(phrase){const pool=Math.random()<.5?WORDS_EN:WORDS_FR;const f=phrase?pool.filter(w=>/[ ']/.test(w)):pool;return pickFrom(f.length?f:pool);}
function randomWord(){return Math.random()<.25?randomForeign(false):randomKo();}
function randomBonus(){return pickFrom(WORDS_PROVERB);}
function wordSet(){
  const fi=Math.floor(Math.random()*4),out=[];
  for(let i=0;i<3;i++){let w;do{w=i===fi?randomForeign(false):randomKo();}while(out.includes(w));out.push(w);}
  out.push(fi===3?randomForeign(true):randomBonus());return out;
}

const SITS=["이별","고백","프러포즈","소개팅","부모님께 인사","싸우고 화해","전 애인과 재회","결혼식 서약"];
const LABELS=["Word 1","Word 2","Word 3","Bonus"];
const W=1080,H=1920,RAILX=W*0.278,STEP=H*0.24,CUR=H*0.50;
const FONT="'Noto Sans KR','Apple SD Gothic Neo',sans-serif";
const cv=document.getElementById("cv"),g=cv.getContext("2d"),vid=document.getElementById("vid");
const $=id=>document.getElementById(id);
{const o=document.createElement("option");o.value="__rand";o.textContent="상황: 랜덤";$("sitSel").appendChild(o);
 SITS.forEach(s=>{const p=document.createElement("option");p.value=s;p.textContent="상황: "+s;$("sitSel").appendChild(p);});}

let stream=null,facing="user",rec=null,chunks=[],state=null,timer=null,offset=0,targetOff=0,countdown=null,sit="이별",t0=0,lastBlob=null,lastName="",mime="";
function toast(t,ms){const el=$("toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);if(ms)toast.t=setTimeout(()=>el.hidden=true,ms);}
async function openStream(){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({
    video:{facingMode:facing,width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:30}},
    audio:{echoCancellation:false,noiseSuppression:true,autoGainControl:true}});
  vid.srcObject=stream;await vid.play().catch(()=>{});
  $("toast").hidden=true;
}
openStream().catch(e=>toast("카메라를 열 수 없어요. 사파리 설정에서 카메라·마이크를 허용해 주세요 ("+e.name+")"));
$("flipBtn").onclick=()=>{if(state)return;facing=facing==="user"?"environment":"user";openStream().catch(e=>toast(e.name,2500));};

function roundRect(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function titleBox(text,cy,size){g.font="700 "+size+"px "+FONT;const tw=g.measureText(text).width,pad=size*.55,h=size*1.45;
  g.fillStyle="#000";roundRect(W/2-tw/2-pad,cy-h/2,tw+pad*2,h,size*.32);g.fill();g.fillStyle="#fff";g.textAlign="center";g.textBaseline="middle";g.fillText(text,W/2,cy+size*.04);}
function shadowText(text,x,y,align,size){g.font="700 "+size+"px "+FONT;g.textAlign=align;g.textBaseline="middle";
  g.shadowColor="rgba(0,0,0,.55)";g.shadowBlur=10;g.shadowOffsetY=3;g.fillStyle="#fff";g.fillText(text,x,y);g.shadowColor="transparent";g.shadowBlur=0;g.shadowOffsetY=0;}
function wrap(text,maxW,size){g.font="700 "+size+"px "+FONT;const out=[];let line="";const parts=text.includes(" ")?text.split(/(\s+)/):[...text];
  for(const p of parts){const t=line+p;if(g.measureText(t).width>maxW&&line.trim()){out.push(line.trim());line=p.trimStart();}else line=t;}if(line.trim())out.push(line.trim());return out;}
function drawCover(){const vw=vid.videoWidth,vh=vid.videoHeight;if(!vw){g.fillStyle="#222";g.fillRect(0,0,W,H);return;}
  const s=Math.max(W/vw,H/vh),dw=vw*s,dh=vh*s;g.drawImage(vid,(W-dw)/2,(H-dh)/2,dw,dh);}
function draw(){
  drawCover();offset+=(targetOff-offset)*0.18;
  g.fillStyle="#fff";g.fillRect(RAILX-3.5,0,7,H);
  if(state&&state.cur){const a=state.cur;
    for(let i=0;i<LABELS.length;i++){const y=CUR+STEP*i-offset;if(y<-100||y>H+100)continue;
      const opened=i<a.idx,rolling=(i===a.idx-1&&a.rolling);
      g.beginPath();g.arc(RAILX,y,40,0,Math.PI*2);g.fillStyle=opened?"#F7D417":"#8C8C8C";g.fill();g.lineWidth=8;g.strokeStyle="#fff";g.stroke();
      shadowText(LABELS[i],RAILX-62,y,"right",40);
      if(opened){const txt=rolling?a.spinText:(a.plan[i]+(a.used[i]?"  ✓":""));const lines=wrap(txt,W-(RAILX+62)-50,48);
        lines.forEach((l,k)=>shadowText(l,RAILX+62,y+(k-(lines.length-1)/2)*60,"left",48));}}}
  titleBox("단어 끼워넣기 즉흥연기",H*0.072,58);titleBox("-"+sit+"-",H*0.072+86,58);
  if(countdown){g.fillStyle="rgba(0,0,0,.25)";g.fillRect(0,0,W,H);g.font="900 360px "+FONT;g.textAlign="center";g.textBaseline="middle";g.fillStyle="#fff";g.fillText(countdown,W/2,H/2);}
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

const nowMs=()=>Math.round(performance.now()-t0);
function newAttempt(){clearTimeout(timer);
  state.cur={start:nowMs(),plan:wordSet(),idx:0,rolling:false,spinText:"",used:{},items:[]};state.attempts.push(state.cur);targetOff=0;offset=0;
  timer=setTimeout(reveal,1200);}
function reveal(){if(!state||!state.cur)return;const a=state.cur;if(a.idx>=LABELS.length||a.rolling)return;clearTimeout(timer);
  const i=a.idx;a.idx++;a.rolling=true;targetOff=STEP*i;const t=nowMs();let n=0;
  const spin=setInterval(()=>{a.spinText=i===3?randomBonus():randomWord();n++;
    if(n>=10){clearInterval(spin);if(state&&state.cur===a){a.rolling=false;a.items.push({k:LABELS[i],v:a.plan[i],t});if(a.idx<LABELS.length&&state.gap)timer=setTimeout(reveal,state.gap);}}},65);}
function markUsed(){if(!state||!state.cur)return;const a=state.cur;for(let i=0;i<a.idx;i++){if(!a.used[i]){a.used[i]=nowMs();const it=a.items.find(x=>x.k===LABELS[i]);if(it)it.usedAt=a.used[i];return;}}}
function pickMime(){const c=["video/mp4;codecs=avc1","video/mp4","video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm"];return c.find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||"";}
function startRec(){
  if(!stream){toast("카메라가 아직 안 켜졌어요",2000);return;}
  sit=$("sitSel").value==="__rand"?SITS[Math.floor(Math.random()*SITS.length)]:$("sitSel").value;
  const out=cv.captureStream(30);stream.getAudioTracks().forEach(t=>out.addTrack(t));
  mime=pickMime();
  try{rec=new MediaRecorder(out,mime?{mimeType:mime,videoBitsPerSecond:8000000}:{videoBitsPerSecond:8000000});}catch(e){toast("이 기기에선 녹화가 안 돼요 ("+e.name+")",3000);return;}
  chunks=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};rec.onstop=done;rec.start(1000);t0=performance.now();
  state={sit,gap:+$("gapSel").value,attempts:[],cur:null};
  $("recBtn").classList.add("on");$("top").style.visibility="hidden";$("saveBtn").hidden=true;
  ["resetBtn","nextBtn","usedBtn"].forEach(id=>$(id).disabled=false);
  try{navigator.wakeLock&&navigator.wakeLock.request("screen").catch(()=>{});}catch(e){}
  let n=3;countdown=n;const cd=setInterval(()=>{n--;if(n>0){countdown=n;return;}clearInterval(cd);countdown=null;newAttempt();},1000);
}
function stopRec(){if(rec&&rec.state==="recording"){clearTimeout(timer);rec.stop();}}
function stamp(){const d=new Date(),p=n=>String(n).padStart(2,"0");return p(d.getMonth()+1)+p(d.getDate())+"_"+p(d.getHours())+p(d.getMinutes());}
function done(){
  const type=(mime||"video/webm").split(";")[0],ext=type.includes("mp4")?"mp4":"webm";
  lastBlob=new Blob(chunks,{type});lastName="즉흥연기_"+sit+"_"+stamp()+"."+ext;
  state=null;$("recBtn").classList.remove("on");$("top").style.visibility="visible";["resetBtn","nextBtn","usedBtn"].forEach(id=>$(id).disabled=true);
  $("saveBtn").hidden=false;toast("녹화 끝! 아래 '영상 저장하기'를 눌러주세요",2500);
}
$("saveBtn").onclick=async()=>{
  if(!lastBlob)return;const file=new File([lastBlob],lastName,{type:lastBlob.type});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});$("saveBtn").hidden=true;return;}}catch(e){if(e.name==="AbortError")return;}
  const a=document.createElement("a");a.href=URL.createObjectURL(lastBlob);a.download=lastName;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},3000);$("saveBtn").hidden=true;
};
$("recBtn").onclick=()=>{if(rec&&rec.state==="recording")stopRec();else startRec();};
$("resetBtn").onclick=()=>state&&state.cur&&newAttempt();
$("nextBtn").onclick=reveal;$("usedBtn").onclick=markUsed;
</script>
</body></html>
